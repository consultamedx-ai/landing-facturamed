  .logout{font-size:.82rem;font-weight:600;color:#5B6B7C;text-decoration:none;border:1px solid var(--linia);padding:8px 15px;border-radius:99px;transition:.16s;background:rgba(255,255,255,.6)}

  .sub{color:#5B6B7C;margin-top:7px;font-size:1.05rem;opacity:0;animation:up .6s .12s both}
  .puls{display:block;width:210px;margin:16px 0 0;opacity:.9}
  .puls path{stroke-dasharray:1;stroke-dashoffset:1;animation:pulsdraw 1.5s .45s ease forwards}
  @keyframes pulsdraw{to{stroke-dashoffset:0}}
  @media(prefers-reduced-motion:reduce){.puls path{animation:none;stroke-dashoffset:0}}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brief{background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(13,59,102,.08);border-left:5px solid var(--taronja);border-radius:18px;padding:20px 22px;margin-top:28px;box-shadow:0 10px 34px rgba(13,59,102,.08);opacity:0;animation:up .6s .2s both}
  .brief-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brief-tit{font-family:'Sora';font-weight:700;color:var(--blau);font-size:1.08rem}
  .brief-tit small{display:block;font-family:'Inter';font-weight:500;color:#64748B;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .brief-kpis{font-size:.9rem;color:#5B6B7C}

  .cites{margin-top:14px;display:flex;flex-direction:column;gap:2px}
  .cita{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--linia)}
  .cita .hora{font-family:'Sora';font-weight:700;color:var(--blau);min-width:50px}
  .cita .cos{flex:1;min-width:0}
  .cita .nom{font-weight:600;font-size:.94rem}
  .cita .motiu{font-size:.8rem;color:#64748B}
  .estat{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}

  .estat.vinguda{background:#ECFDF5;color:#047857}.estat.noshow{background:#FEF2F2;color:#B91C1C}
  .brief-link{display:inline-block;margin-top:15px;font-weight:700;color:var(--taronja);text-decoration:none;font-size:.9rem;transition:.15s}
  .brief-link:hover{transform:translateX(3px)}
  .buit{color:#64748B;font-size:.94rem;margin-top:6px}
  .seccio{font-family:'Sora';font-weight:700;color:var(--blau);font-size:1.1rem;margin:38px 0 4px;opacity:0;animation:up .6s .28s both}
  .seccio small{font-family:'Inter';font-weight:500;color:#64748B;font-size:.82rem} /* QA 03-09: Gris Boira només decoratiu (bíblia §4): com a text feia 2,5:1; #64748B fa 4,76 sobre blanc i 4,54 sobre Gasa */

  .card{display:block;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(13,59,102,.08);border-radius:20px;padding:24px 22px;text-decoration:none;color:inherit;transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s;position:relative;overflow:hidden;opacity:0;animation:up .55s both}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--acc,#ccc),transparent 85%)}
  .card::after{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--acc,#ccc),transparent 68%);opacity:0;transition:opacity .25s}

  .card:hover::after{opacity:.13}
  #card-secre{animation-delay:.3s}.grid a:nth-child(2){animation-delay:.37s}.grid a:nth-child(3){animation-delay:.44s}#card-recept{animation-delay:.51s}

  .card-logo img{max-height:33px;width:auto}
  .card-desc{color:#5B6B7C;font-size:.92rem;margin-top:2px;position:relative}
  .card-go{margin-top:14px;font-weight:700;font-size:.9rem;color:var(--acc,#333);position:relative;display:inline-flex;gap:5px;transition:gap .18s}

  .soon-tag{position:absolute;top:16px;right:16px;font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#EEF2F7;color:#64748B;padding:4px 10px;border-radius:99px}

.act-wrap{max-width:640px}

.act-cal-tit{font-weight:700;margin-bottom:4px}
.act-cal p{margin:0;line-height:1.55}
/* ENG-25 · la línia legal de la porta 0 (contracte del 03/09, §5): el mateix
   cos secundari que .act-sub (#5B6B7C, 5,2:1 sobre Blanc Gasa) i l'enllaç en
   Blau Clínic, subratllat perquè es vegi que ho és. S'obre en una pestanya
   nova: l'activació és una pàgina amb estat a mitges i no s'ha de perdre per
   anar a llegir les condicions. */
.act-legal{font-size:.86rem;color:#5B6B7C;line-height:1.55;margin:0 0 18px}
.act-legal a{color:#0D3B66;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.act-legal a:focus-visible{outline:2px solid #0D3B66;outline-offset:2px}
.act-camps{display:flex;flex-direction:column;gap:14px;margin:0 0 18px}
.act-camp label{display:block;font-weight:600;font-size:.86rem;margin-bottom:5px}
.act-camp input{width:100%;padding:11px 13px;border:1px solid rgba(148,163,184,.5);border-radius:10px;font:inherit;background:#fff}
.act-camp input:focus{outline:2px solid #14B8A6;outline-offset:1px;border-color:transparent}
.act-camp.mal input{border-color:#C0392B}
.act-camp .err{color:#C0392B;font-size:.82rem;margin-top:5px;display:none}
.act-camp.mal .err{display:block}
.act-desat{color:#0F9488;font-size:.82rem;margin:0 0 14px}
.act-avis{border-left:3px solid #C9A227;background:rgba(201,162,39,.08);padding:12px 14px;border-radius:0 10px 10px 0;margin:0 0 18px;line-height:1.55}
.act-botons{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.act-b{font:inherit;font-weight:700;border-radius:10px;padding:12px 22px;cursor:pointer;border:1px solid transparent}
.act-b-si{background:#0D3B66;color:#fff}
.act-b-si:hover{background:#12497e}
.act-b-si[disabled]{opacity:.5;cursor:default}
.act-b-no{background:transparent;color:#5B6B7C;border-color:rgba(148,163,184,.5)}
.act-b-no:hover{color:#0D3B66;border-color:#0D3B66}
/* La barra d'activació a mig fer, al hub */
.act-represa{display:block;background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.4);color:#0B5F57;
  border-radius:12px;padding:12px 16px;margin:0 0 20px;font-weight:600;text-decoration:none}

<!-- ═══════════════════════════════════════════════════════════════════════
     ENG-13b ② · PANTALLA D'ACTIVACIÓ  ·  hub.html?activar=1&tornar=app|escriba|secre
     Enginyeria · 26/08/2026 · flux de Producte/16, literals de Producte/09 §1.8 i 12 §4

     És una PÀGINA i no un modal (decisió de Disseny, DIS-8): té la seva URL,
     es pot recarregar, es pot deixar a mitges i tornar-hi demà, i el botó
     enrere del navegador fa el que sembla. Un modal no fa res d'això, i
     l'activació és justament el moment on el metge s'aturarà.
     ═══════════════════════════════════════════════════════════════════════ -->
<div class="wrap act-wrap" id="activacio" hidden>
  <div class="act-passos" id="act-passos" aria-hidden="true"></div>

  <!-- PORTA 0 · què li costa i què li passa a la seva feina -->
  <section class="act-porta" id="act-p0" hidden>
    <h1 class="act-tit" id="a0-tit"></h1>
    <p class="act-preu" id="a0-preu"></p>
    <div class="act-cos" id="a0-cos"></div>
    <div class="act-cal" id="a0-cal">
      <div class="act-cal-tit" id="a0-cal-tit"></div>
      <p id="a0-cal-txt"></p>
    </div>
    <!-- ENG-25 · acceptació de les condicions del servei i del contracte d'encàrrec, abans dels botons -->
    <p class="act-legal" id="a0-legal"></p>
    <div class="act-botons">
      <button class="act-b act-b-si" type="button" id="a0-segueix"></button>
      <button class="act-b act-b-no" type="button" id="a0-surt"></button>
    </div>
  </section>

  <!-- PORTA 1 · dades fiscals -->
  <section class="act-porta" id="act-p1" hidden>
    <h1 class="act-tit" id="a1-tit"></h1>
    <p class="act-sub" id="a1-sub"></p>
    <div class="act-camps" id="a1-camps"></div>
    <p class="act-desat" id="a1-desat" hidden></p>
    <div class="act-botons">
      <button class="act-b act-b-si" type="button" id="a1-segueix"></button>
      <button class="act-b act-b-no" type="button" id="a1-surt"></button>
    </div>
  </section>

  <!-- PORTA 2 · pagament -->
  <section class="act-porta" id="act-p2" hidden>
    <h1 class="act-tit" id="a2-tit"></h1>
    <p class="act-sub" id="a2-sub"></p>
    <div class="act-avis" id="a2-avis" hidden></div>
    <div class="act-botons">
      <button class="act-b act-b-si" type="button" id="a2-paga"></button>
      <button class="act-b act-b-no" type="button" id="a2-surt"></button>
    </div>
  </section>

  <!-- ESPERANT · s'ha pagat i el servidor encara no ho sap -->
  <section class="act-porta" id="act-esperant" hidden>
    <h1 class="act-tit" id="ae-tit"></h1>
    <p class="act-sub" id="ae-sub"></p>
    <p class="act-cos" id="ae-nopaguis"></p>
    <div class="act-botons">
      <button class="act-b act-b-no" type="button" id="ae-surt"></button>
    </div>
  </section>

  <!-- FET · el compte ja és actiu -->
  <section class="act-porta" id="act-fet" hidden>
    <h1 class="act-tit" id="af-tit"></h1>
    <p class="act-sub" id="af-sub"></p>
    <div class="act-cos" id="af-seguent"></div>
    <div class="act-botons">
      <button class="act-b act-b-si" type="button" id="af-continua"></button>
    </div>
  </section>
</div>

  (function(){

    function aplica(prods){
      if(!prods || !prods.length) return;
      Object.keys(MAPA).forEach(function(p){
        var el=document.getElementById(MAPA[p]);
        if(!el) return;
        if(prods.indexOf(p)<0) el.setAttribute('data-amagat','1');
        else el.removeAttribute('data-amagat');
      });
    }

       hub), ni la sonda: ho decideix cmStore.potHaverSessio, que te el perque
       escrit a cmstore.js. La promesa es comparteix amb l'activacio (mes avall)
       per window.cmSessio: resol amb la resposta de `jo` si hi ha sessio, i
       amb null si no. */

    var sessio=window.cmSessio=(st.potHaverSessio&&!st.potHaverSessio())?Promise.resolve(null):
      fetch('https://app.consultamed.es/api/s',{method:'POST',credentials:'include',

        if(!d||!d.ok||!d.usuari) return null;
        if(st.anotaSessio) st.anotaSessio(true);
        return d;
      }).catch(function(){ return null; });
    // 2n: el que en diu el servidor
    sessio.then(function(d){
      if(!d||!d.usuari.productes) return;
      try{localStorage.setItem('cm_productes',JSON.stringify(d.usuari.productes));}catch(e){}
      aplica(d.usuari.productes);
    });
    // GestorMed: si l'usuari pertany a una gestoria, li ensenyem la seva porta.
    sessio.then(function(u){ if(!u) return;
      return fetch('https://app.consultamed.es/api/s',{method:'POST',credentials:'include',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({accio:'gestoria.meves'})})

        if(!d||!d.ok||!d.gestories||!d.gestories.length) return;
        if(document.getElementById('card-gestor')) return;
        var grid=document.querySelector('.grid'); if(!grid) return;
        var a=document.createElement('a');
        a.className='card'; a.id='card-gestor'; a.href='gestoria.html';
        a.style.setProperty('--acc','#0D3B66');
        // Auditoria 31/07/2026 (H2): el nom de la gestoria el pot haver escrit el METGE
        // (encarrec.vincula la crea). Mai innerHTML amb text d'un altre usuari.
        var lg=document.createElement('div');

        var de=document.createElement('div');
        de.className='card-desc';
        de.textContent=d.gestories[0].nom+' · el compliment VeriFactu dels seus metges';
        var go=document.createElement('div');
        go.className='card-go'; go.textContent='Obrir →';
        a.appendChild(lg); a.appendChild(de); a.appendChild(go);
        grid.appendChild(a);
      });
    }).catch(function(){});

})();

      noconf:"Die Zahlungen sind noch nicht aktiv. Sie können das schließen und im Testmodus weiterarbeiten: es geht nichts verloren.",
      norec:"Zum Aktivieren des Kontos braucht es einen Arzt oder eine Zentrumsverwaltung. Wenn Sie den Empfang machen, fragen Sie die Zentrumsleitung.",
      nocon:"Wir konnten den Server nicht erreichen. Versuchen Sie es gleich noch einmal; es wurde nichts abgebucht.",
      aetit:"Zahlung wird geprüft…", aesub:"Das dauert ein paar Sekunden.",
      aenop:"<b>Wenn Sie bezahlt haben und sich diese Seite nicht aktualisiert, zahlen Sie nicht noch einmal</b>: schließen Sie sie und kommen Sie in einer Minute zurück. Ihre Zahlung ist bereits bei uns angekommen.",
      aftit:"Das Konto ist jetzt aktiv", afsub:"Ab jetzt sind Ihre Rechnungen echt und werden an die AEAT übermittelt.",
      afseg:"<b>Nächster Schritt</b>: Ihre erste echte Rechnung ausstellen. Ihre Serie beginnt bei <b>0001</b>.",
      afcont:"Erste echte Rechnung ausstellen",
      cancel:"Die Zahlung wurde abgebrochen. Es wurde nichts abgebucht und das Konto ist weiterhin im Testmodus.",
      represa:"Aktivierung halb fertig · Weiter"
    }
  };

  function idi(){var l=localStorage.getItem('em_idioma_ui');return TA[l]?l:'ca'}
  var t=TA[idi()];
  function $(i){return document.getElementById(i)}
  function conf(){try{return JSON.parse(localStorage.getItem('fm2_config'))||{}}catch(e){return {}}}
  function desaConf(c){try{localStorage.setItem('fm2_config',JSON.stringify(c));window.cmSync&&cmSync.canvi('fm2_config')}catch(e){}}
  function pas(){try{var v=JSON.parse(localStorage.getItem(K_PAS));return v&&typeof v.porta==='number'?v.porta:0}catch(e){return 0}}
  function desaPas(n){try{localStorage.setItem(K_PAS,JSON.stringify({porta:n}))}catch(e){}}
  function netejaPas(){try{localStorage.removeItem(K_PAS)}catch(e){}}

  function api(accio,dades){
    /* ENG-22 (nota) · cap crida sense sessio: s'espera la sonda `jo` del hub
       (window.cmSessio, mes amunt) i, si no n'hi ha, es respon aqui mateix el
       que respondria el servidor (el 401 «Sense sessio»), sense sortir a la
       xarxa: cada porta fa exactament el que feia. Si la sonda no existis (no
       hauria de passar), es crida com abans: el dubte cau del canto de preguntar. */
    return (window.cmSessio||Promise.resolve(true)).then(function(u){
      if(!u) return {ok:false,error:'Sense sessio'};
      return fetch(API,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(Object.assign({accio:accio},dades||{}))}).then(function(r){return r.json()});
    });
  }

  /* ── La barra del hub quan hi ha una activació a mig fer ────────────────── */
  function pintaRepresa(){
    if(pas()<=0) return;
    var w=document.querySelector('.wrap'); if(!w) return;
    var a=document.createElement('a');
    a.className='act-represa'; a.id='act-represa';
    a.href='hub.html?activar=1';
    a.textContent=TA[idi()].represa;
    w.insertBefore(a,w.firstChild);
  }

  /* ── Ensenyar una porta ────────────────────────────────────────────────── */
  /* ── ENG-16 ⑦ · els comptadors de Producte/16 §6 ──────────────────────────
     Un esdeveniment per porta, i cap dada. La pregunta que responen és «a quina
     porta es queden», i sense ells l'única manera de saber que el flux falla és
     que un metge s'aturi i no ens ho digui mai.
     `marca()` no espera resposta i s'empassa els errors: si el comptador no
     arriba, el metge no se n'ha d'assabentar mai — mesurar el flux no pot
     trencar el flux. */
  var _marcades={};
  function marca(porta,fet){
    var clau=porta+'.'+fet;
    if(fet==='vista'&&_marcades[clau])return;   /* una recàrrega no és una visita nova */
    _marcades[clau]=true;
    try{api('activacio.marca',{porta:porta,fet:fet}).catch(function(){})}catch(e){}
  }

  var PORTES=['act-p0','act-p1','act-p2','act-esperant','act-fet'];
  var PORTA_DE={'act-p0':0,'act-p1':1,'act-p2':2,'act-esperant':2,'act-fet':3};
  function mostra(id){
    document.querySelectorAll('.wrap').forEach(function(w){ if(w.id!=='activacio') w.hidden=true; });
    $('activacio').hidden=false;
    PORTES.forEach(function(p){ var e=$(p); if(e) e.hidden=(p!==id); });
    if(PORTA_DE[id]!==undefined)marca(PORTA_DE[id],'vista');
    var n={'act-p0':1,'act-p1':2,'act-p2':3,'act-esperant':3,'act-fet':3}[id]||1;
    $('act-passos').innerHTML='<i class="'+(n>=1?'fet':'')+'"></i><i class="'+(n>=2?'fet':'')+'"></i><i class="'+(n>=3?'fet':'')+'"></i>';
    document.title='ConsultaMed · '+t.tit;
  }
  function surt(){
    /* «Ara no» és un abandonament declarat, i és el senyal més útil dels tres:
       vol dir que ha llegit la porta i ha decidit que no. */
    var visible=PORTES.filter(function(p){var e=$(p);return e&&!e.hidden})[0];
    if(visible&&PORTA_DE[visible]!==undefined)marca(PORTA_DE[visible],'abandonada');
    location.href=TORNAR;
  }

  /* ── PORTA 0 ───────────────────────────────────────────────────────────── */
  function porta0(){
    $('a0-tit').textContent=t.tit;
    $('a0-preu').textContent=t.preu;
    $('a0-cos').innerHTML=t.cos.map(function(p){return '<p>'+p+'</p>'}).join('');
    $('a0-cal-tit').textContent=t.calTit;
    $('a0-cal-txt').innerHTML=t.calTxt;
    $('a0-legal').innerHTML=t.legal;   /* ENG-25 · porta l'enllaç dins: legal.html, o legal-es.html en castellà */
    $('a0-segueix').textContent=t.segueix;
    $('a0-surt').textContent=t.arano;
    $('a0-segueix').onclick=function(){marca(0,'completada');desaPas(1);porta1()};
    $('a0-surt').onclick=surt;
    mostra('act-p0');
  }

  /* ── PORTA 1 · només el que falta ──────────────────────────────────────── */
  var CAMPS=[
    {k:'nom',      l:'lNom', e:'eNom', max:120, val:function(v){return v.trim().length>1}},
    {k:'nif',      l:'lNif', e:'eNif', max:9,   val:function(v){return NIF_RE.test(v.trim().toUpperCase())}},
    {k:'colegiat', l:'lCol', e:'eCol', max:20,  val:function(v){return v.trim().length>0}},
    {k:'adreca',   l:'lAdr', e:'eAdr', max:160, val:function(v){return v.trim().length>4}}
  ];
  function porta1(){
    $('a1-tit').textContent=t.p1tit; $('a1-sub').textContent=t.p1sub;
    $('a1-segueix').textContent=t.segueix; $('a1-surt').textContent=t.arano;
    var c=conf();
    /* Nomes el que falta, mai el que ja tenim (Producte/16, porta 1). */
    var caldran=CAMPS.filter(function(x){return !x.val(String(c[x.k]||''))});
    $('a1-camps').innerHTML=caldran.map(function(x){
      return '<div class="act-camp" id="camp-'+x.k+'">'+
        '<label for="a1-'+x.k+'">'+t[x.l]+'</label>'+
        '<input id="a1-'+x.k+'" maxlength="'+x.max+'" value="'+String(c[x.k]||'').replace(/"/g,'&quot;')+'">'+
        '<div class="err">'+t[x.e]+'</div></div>';
    }).join('');
    if(!caldran.length){ marca(1,'completada'); desaPas(2); porta2(); return; }

    caldran.forEach(function(x){
      var el=$('a1-'+x.k);
      el.addEventListener('input',function(){
        var c2=conf(); c2[x.k]=(x.k==='nif'?el.value.trim().toUpperCase():el.value); desaConf(c2);
        $('camp-'+x.k).classList.remove('mal');
        var d=$('a1-desat'); d.textContent=t.desat; d.hidden=false;
      });
      /* Es valida en sortir del camp, no en escriure: marcar en vermell mentre
         algu escriu el tercer caracter del NIF es dir-li que s'equivoca abans
         d'haver acabat. */
      el.addEventListener('blur',function(){
        $('camp-'+x.k).classList.toggle('mal', !x.val(el.value));
      });
    });
    $('a1-segueix').onclick=function(){
      var mal=false;
      caldran.forEach(function(x){
        var ok=x.val($('a1-'+x.k).value);
        $('camp-'+x.k).classList.toggle('mal',!ok);
        if(!ok&&!mal){mal=true;$('a1-'+x.k).focus()}
      });
      if(mal) return;
      marca(1,'completada');
      desaPas(2); porta2();
    };
    $('a1-surt').onclick=surt;
    mostra('act-p1');
  }

  /* ── PORTA 2 · pagament ────────────────────────────────────────────────── */
  function porta2(estat){
    $('a2-tit').textContent=t.p2tit; $('a2-sub').textContent=t.p2sub;
    $('a2-paga').textContent=t.paga; $('a2-surt').textContent=t.arano;
    $('a2-surt').onclick=surt;
    var avis=$('a2-avis'); avis.hidden=true;

    if(q.get('pagament')==='cancellat'){ avis.textContent=t.cancel; avis.hidden=false; }
    if(estat&&estat.actiu===false){ avis.textContent=t.noconf; avis.hidden=false; $('a2-paga').disabled=true; }
    if(estat&&estat.potPagar===false){ avis.textContent=t.norec; avis.hidden=false; $('a2-paga').disabled=true; }

    $('a2-paga').onclick=function(){
      $('a2-paga').disabled=true;
      /* L'etiqueta, no la URL: la construeix el servidor amb una llista tancada
         (lib/retorns.js). Una URL de retorn que surti d'aqui es una redireccio
         oberta amb el nostre domini al davant. */
      api('pagament.inicia',{periode:'mes',torna:ETIQ_RETORN}).then(function(r){
        if(r&&r.ok&&r.url){ marca(2,'completada'); location.href=r.url; return; }
        $('a2-paga').disabled=false;
        avis.textContent=(r&&r.error)?r.error:t.nocon; avis.hidden=false;
      }).catch(function(){
        $('a2-paga').disabled=false; avis.textContent=t.nocon; avis.hidden=false;
      });
    };
    mostra('act-p2');
  }

  /* ── ESPERANT ──────────────────────────────────────────────────────────── */
  /* S'hi entra quan es torna de Stripe: el navegador torna abans que el webhook
     hagi arribat, o sigui que preguntar-ho una sola vegada donaria «encara en
     prova» a algu que acaba de pagar. Es pregunta unes quantes vegades i, si
     tampoc, es diu clarament que NO torni a pagar. */
  function esperant(){
    $('ae-tit').textContent=t.aetit; $('ae-sub').textContent=t.aesub;
    $('ae-nopaguis').innerHTML=t.aenop;
    $('ae-surt').textContent=t.arano; $('ae-surt').onclick=surt;
    mostra('act-esperant');
    var voltes=0;
    (function torna(){
      voltes++;
      api('pagament.estat',{}).then(function(r){
        var s=r&&r.subscripcio;
        if(s&&s.estat==='ACTIVA'){ fet(); return; }
        if(voltes<8) setTimeout(torna,2500); else { $('ae-tit').textContent=t.aetit; $('ae-sub').textContent=''; }
      }).catch(function(){ if(voltes<8) setTimeout(torna,2500); });
    })();
  }

  /* ── FET ───────────────────────────────────────────────────────────────── */
  function fet(){
    netejaPas();
    $('af-tit').textContent=t.aftit; $('af-sub').textContent=t.afsub;
    $('af-seguent').innerHTML='<p>'+t.afseg+'</p>';
    $('af-continua').textContent=t.afcont;
    $('af-continua').onclick=function(){ location.href='app.html'; };
    mostra('act-fet');
  }

  /* ── Entrada ───────────────────────────────────────────────────────────── */
  /* Si no venim per `?activar=1`, aqui no hi ha res a fer: nomes, si hi havia
     una activacio a mig fer, ensenyar-ho al hub.
     Aquesta linia era a dalt de tot i era un error meu: cridava `pintaRepresa()`
     abans que `var TA` tingues cap valor, o sigui que el hub petava amb un
     TypeError per a qualsevol que hagues comencat una activacio i l'hagues
     deixada. No es veia perque nomes passa amb `cm_activacio` desat. */
  if(q.get('activar')!=='1'){ pintaRepresa(); return; }

  /* Primer es pregunta al servidor, sempre, i despres es decideix que ensenyar.
     Si el servidor no respon, s'ensenya la porta on anava: no es pot ni
     confirmar ni negar un pagament sense ell, i inventar-s'ho es el que
     produeix els dos estats que Producte prohibeix al seu §4. */
  mostra(pas()>=2?'act-p2':(pas()===1?'act-p1':'act-p0'));
  api('pagament.estat',{}).then(function(r){
    var s=(r&&r.subscripcio)||null;
    if(s&&s.estat==='ACTIVA'){ fet(); return; }
    if(q.get('pagament')==='fet'){ esperant(); return; }
    var p=pas();
    if(p>=2) porta2(s); else if(p===1) porta1(); else porta0();
  }).catch(function(){
    var p=pas();
    if(p>=2) porta2(null); else if(p===1) porta1(); else porta0();
  });
})();
</script>
