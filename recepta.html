<meta charset="UTF-8">
  <!-- ENG-7 · favicon (DIS-3) -->
  <link rel="icon" href="/favicon.ico" sizes="any">

<title>ReceptaMed</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="tipografies/tipografies.css">
<style id="rm-page">@page { size: 210mm 148mm; margin: 0 }</style>
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     ReceptaMed v1 · Enginyeria · 7/10/2026 (ENG-40, i l'esmena A2: ENG-41)
     - Tokens de Disseny v2.4: Blau Clinic, Blanc Gasa, Grafit, Linia, Tinta
       Clara (tot el text secundari: mai Gris Boira), Tinta Teal.
     - Accent de ReceptaMed (DIS-16 §5): el boto principal, Cian fosc #0E7490
       amb Blanc Gasa (5,11:1) i, en passar-hi el ratoli, #0C6179 (6,67:1): el
       text no canvia mai de color. El Cian #0891B2 nomes on no hi ha text en
       blanc a sobre (la pestanya activa, els filets), amb Tinta Teal (4,64:1).
     - Focus: Blau Clinic, 2 px i 2 px de separacio (10,92:1 sobre Gasa).
     - La recepta impresa (.rm-full) va tota en mm i en #000: es el mateix DOM
       a la previsualitzacio (escalat) i al paper.
     ═══════════════════════════════════════════════════════════════════════ */
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  :root{--blau:#0D3B66;--gasa:#F7FAFC;--grafit:#1F2937;--linia:#E2E8F0;--boira:#94A3B8;--tinta-clara:#4B5B6C;--tinta-teal:#04201D;--acc:#0891B2;--acc2:#0E7490;--acc3:#0C6179;--error:#B91C1C;--avis:#92400E;--ok:#047857}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,Helvetica,sans-serif;color:var(--grafit);line-height:1.5;background:var(--gasa);min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Sora","Inter","Segoe UI",system-ui,sans-serif;color:var(--blau);line-height:1.25}
  a{color:var(--acc2)}
  :focus-visible{outline:2px solid var(--blau);outline-offset:2px}
  .rm-ocult{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

  /* ── capçalera ── */
  .rm-nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);border-bottom:1px solid var(--linia)}
  .rm-nav-in{max-width:1180px;margin:0 auto;padding:0 20px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rm-logo{display:inline-flex;align-items:center;flex:0 0 auto}
  .rm-logo-img{height:29px;width:auto;display:block;flex:0 0 auto}
  .rm-nav-dreta{display:flex;align-items:center;gap:10px}
  .rm-nav-enllac{font-size:.85rem;font-weight:600;color:var(--acc2);text-decoration:none;display:inline-flex;align-items:center;min-height:36px;padding:0 6px;border-radius:8px;white-space:nowrap}
  .rm-nav-enllac:hover{text-decoration:underline}
  .rm-idioma{font:inherit;font-size:.8rem;font-weight:600;color:var(--blau);background:#fff;border:1px solid var(--linia);border-radius:99px;padding:6px 10px;min-height:36px}

  /* ── estructura ── */
  .rm-wrap{max-width:1180px;margin:0 auto;padding:22px 20px 110px}
  .rm-card{background:#fff;border:1px solid var(--linia);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 26px rgba(13,59,102,.05)}
  .rm-card h2{font-size:1.02rem;margin-bottom:10px}
  .rm-card h3{font-size:.9rem;margin:16px 0 4px}
  .rm-nota{font-size:.8rem;color:var(--tinta-clara);margin-top:6px}
  label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 4px;color:var(--grafit)}
  input,select,textarea{width:100%;font:inherit;font-size:.92rem;color:var(--grafit);background:#fff;border:1px solid #CBD5E1;border-radius:9px;padding:9px 12px;min-width:0}
  textarea{resize:vertical;min-height:62px;line-height:1.45}
  input::placeholder,textarea::placeholder{color:#6B7785}
  input[readonly]{background:var(--gasa)}
  input:disabled,select:disabled,textarea:disabled{background:#EEF2F6;color:#475569}
  input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--error);box-shadow:0 0 0 1px var(--error)}
  .rm-check{display:flex;align-items:flex-start;gap:8px;font-weight:500;font-size:.84rem;margin-top:12px;cursor:pointer}
  .rm-check input{width:auto;margin-top:3px;flex:0 0 auto;accent-color:var(--acc2)}
  .rm-fila{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .rm-fila>*{min-width:0}
  .rm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:.92rem;border:1.5px solid var(--acc2);background:var(--acc2);color:var(--gasa);border-radius:99px;padding:10px 20px;cursor:pointer;text-decoration:none;min-height:42px}
  .rm-btn:hover{background:var(--acc3);border-color:var(--acc3);color:var(--gasa)}
  .rm-btn.sec{background:#fff;color:var(--blau);border-color:#CBD5E1}
  .rm-btn.sec:hover{background:var(--gasa);color:var(--blau);border-color:var(--blau)}
  .rm-btn.perill{background:#fff;color:var(--error);border-color:#FECACA}
  .rm-btn.perill:hover{background:#FEF2F2;color:var(--error);border-color:var(--error)}
  .rm-btn.mini{font-size:.78rem;padding:5px 12px;min-height:32px}
  .rm-btn:disabled{opacity:.55;cursor:not-allowed}
  .rm-btn:disabled:hover{background:var(--acc2);border-color:var(--acc2);color:var(--gasa)}
  .rm-btn.sec:disabled:hover{background:#fff;color:var(--blau);border-color:#CBD5E1}
  .rm-botons{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .rm-banner{border-radius:12px;padding:11px 15px;font-size:.88rem;margin-bottom:14px}
  .rm-banner.ok{background:#ECFDF5;border:1px solid #A7F3D0;color:var(--ok)}
  .rm-banner.err{background:#FEF2F2;border:1px solid #FECACA;color:var(--error)}
  .rm-banner.info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF}
  .rm-avis{background:#FFFBEB;border:1px solid #FDE68A;color:var(--avis);border-radius:10px;padding:9px 12px;font-size:.82rem;margin-top:10px}
  .rm-avis-suau{color:var(--avis);font-size:.8rem;margin-top:5px}
  .rm-ajuda{font-size:.78rem;color:var(--tinta-clara);margin-top:5px}
  /* ENG-41 (A2 §4) · els avisos fixos de Legal (23_ §4.8 i §7.3): no detecten res */
  .rm-avis-fix{background:#F0F9FF;border:1px solid #BAE6FD;border-left:4px solid var(--acc);color:var(--grafit);border-radius:10px;padding:10px 13px;font-size:.82rem;line-height:1.5;margin-top:12px}
  .rm-avis-fix strong{font-weight:700}
  .rm-primer{margin:0 0 16px}
  .rm-primer-tit{font-weight:700;color:var(--blau);margin-bottom:4px}
  .rm-primer .rm-botons{margin-top:10px}
  #sec-dades>.rm-avis-fix{margin:0 0 14px}
  .rm-ok{background:#ECFDF5;border:1px solid #A7F3D0;color:var(--ok);border-radius:10px;padding:10px 13px;font-size:.88rem;font-weight:600;margin-top:14px}
  .rm-errors{background:#FEF2F2;border:1px solid #FECACA;color:var(--error);border-radius:12px;padding:12px 15px;font-size:.86rem;margin-top:14px}
  .rm-errors p{font-weight:700;margin-bottom:6px}
  .rm-errors ul{margin:0 0 0 18px}
  .rm-errors li{margin:3px 0}
  .rm-err-camp{font:inherit;color:var(--error);background:none;border:0;text-align:left;text-decoration:underline;cursor:pointer;padding:0}
  .rm-carregant{color:var(--tinta-clara);text-align:center;padding:60px 0}

  /* ── pantalles neutres (porta tancada · rol) ── */
  .rm-neutra{max-width:520px;margin:60px auto;text-align:center;background:#fff;border:1px solid var(--linia);border-radius:18px;padding:34px 26px}
  .rm-neutra-logo{height:44px;width:auto;margin:0 auto 18px;display:block}
  .rm-neutra-tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#EEF2F7;color:var(--tinta-clara);padding:4px 12px;border-radius:99px;margin-bottom:12px}
  .rm-neutra-txt{color:var(--grafit);font-size:1rem;margin-bottom:22px}

  /* ── selector de metge (mode centre) ── */
  .rm-metge-tria{background:#fff;border:1px solid var(--linia);border-left:4px solid var(--acc);border-radius:12px;padding:10px 16px 14px;margin-bottom:16px;max-width:520px}
  .rm-metge-tria label{margin-top:0}

  /* ── pestanyes ── */
  .rm-tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--linia);border-radius:99px;padding:4px;margin-bottom:18px;width:max-content;max-width:100%;overflow-x:auto}
  .rm-tab{font:inherit;font-size:.86rem;font-weight:600;color:var(--tinta-clara);background:none;border:0;border-radius:99px;padding:8px 16px;cursor:pointer;white-space:nowrap;min-height:38px}
  .rm-tab[aria-selected="true"]{background:var(--acc);color:var(--tinta-teal)}

  /* ── nova recepta ── */
  .rm-nova{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
  .rm-pac-cerca-wrap{position:relative}
  .rm-pac-llista{list-style:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid #CBD5E1;border-radius:10px;box-shadow:0 12px 28px rgba(13,59,102,.14);margin-top:4px;max-height:320px;overflow:auto}
  .rm-pac-llista li{padding:9px 12px;cursor:pointer;font-size:.88rem;border-top:1px solid var(--linia)}
  .rm-pac-llista li:first-child{border-top:0}
  .rm-pac-llista li[aria-selected="true"],.rm-pac-llista li:hover{background:#E0F2F7}
  .rm-pac-llista li small{color:var(--tinta-clara);margin-left:6px}
  .rm-pac-llista li.rm-buida{cursor:default;color:var(--tinta-clara)}
  .rm-pac-nou{border:1px dashed #CBD5E1;border-radius:12px;padding:4px 14px 14px;margin-top:12px;background:var(--gasa)}
  .rm-previ-card{position:sticky;top:76px}
  .rm-previ{position:relative;width:100%;overflow:hidden;border:1px solid #CBD5E1;border-radius:6px;background:#fff;box-shadow:0 6px 18px rgba(13,59,102,.10)}
  .rm-previ>.rm-impres{position:absolute;left:0;top:0;transform-origin:0 0}

  /* ── historial ── */
  .rm-filtres{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 14px;align-items:end}
  .rm-filtres>*{min-width:0}
  .rm-export{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .rm-compte{font-size:.82rem;color:var(--tinta-clara);margin:14px 0 6px}
  .rm-taula{width:100%;border-collapse:collapse;font-size:.86rem}
  .rm-taula th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta-clara);font-weight:700;padding:8px;border-bottom:2px solid var(--linia)}
  .rm-taula td{padding:9px 8px;border-bottom:1px solid var(--linia);vertical-align:top}
  .rm-taula tr.rm-anullada td{color:#475569}
  .rm-taula tr.rm-anullada .rm-h-med{text-decoration:line-through}
  .rm-accions{white-space:nowrap}
  .rm-accions .rm-btn{margin:0 4px 4px 0}
  .rm-estat{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:99px}
  .rm-estat.emesa{background:#E0F2F7;color:#0B4F63}
  .rm-estat.anullada{background:#FEF2F2;color:#991B1B}
  .rm-mostra{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:#FEF3C7;color:var(--avis);margin-left:4px}
  .rm-buit{color:var(--tinta-clara);text-align:center;padding:24px 0;font-size:.9rem}

  /* ── dades ── */
  .rm-dades{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;align-items:start}
  .rm-dades>*{min-width:0}
  fieldset{border:0}
  legend{font-size:.8rem;font-weight:600;margin:12px 0 4px}
  .rm-radio{display:flex;align-items:flex-start;gap:8px;font-weight:500;font-size:.88rem;margin:8px 0;cursor:pointer}
  .rm-radio input{width:auto;margin-top:4px;accent-color:var(--acc2)}
  .rm-radio input:disabled+span{color:#64748B}

  /* ── finestres ── */
  .rm-modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .rm-modal-caixa{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:880px;box-shadow:0 24px 60px rgba(15,23,42,.35)}
  .rm-modal-caixa.estreta{max-width:520px}
  .rm-modal-caixa h2{font-size:1.05rem;margin-bottom:8px}
  .rm-mv-previ{position:relative;width:100%;overflow:hidden;border:1px solid #CBD5E1;border-radius:6px;background:#fff;margin:12px 0}
  .rm-mv-previ>.rm-impres{position:absolute;left:0;top:0;transform-origin:0 0}
  /* a la pantalla, els dos fulls de l'A5 i del paper amb capçalera, l'un sota
     l'altre i separats per una franja (al paper, cadascun a la seva pagina) */
  .rm-previ .rm-impres,.rm-mv-previ .rm-impres{background:#CBD5E1}
  .rm-previ .rm-full+.rm-full,.rm-mv-previ .rm-full+.rm-full{margin-top:4mm}

  body:has(#barra-prova) #cm-sync-xip{bottom:64px!important}

  @media (max-width:860px){
    .rm-nova{grid-template-columns:1fr}
    .rm-previ-card{position:static}
    .rm-dades{grid-template-columns:1fr}
  }
  @media (max-width:600px){
    .rm-taula thead{display:none}
    .rm-taula,.rm-taula tbody,.rm-taula tr,.rm-taula td{display:block;width:100%}
    .rm-taula tr{border:1px solid var(--linia);border-radius:12px;padding:8px 10px;margin-bottom:10px}
    .rm-taula td{border:0;padding:4px 0}
    .rm-taula td[data-l]::before{content:attr(data-l) " · ";font-weight:700;color:var(--tinta-clara);font-size:.74rem}
    .rm-filtres{grid-template-columns:1fr}
  }
  @media (max-width:560px){
    .rm-nav-in{padding:0 14px}
    .rm-wrap{padding:16px 14px 110px}
    .rm-fila{grid-template-columns:1fr}
    .rm-tab,.rm-btn,.rm-nav-enllac,.rm-idioma,input:not([type=checkbox]):not([type=radio]),select,textarea{min-height:44px}
    .rm-tabs{width:100%;flex-wrap:wrap;border-radius:18px}
    .rm-tab{flex:1 1 auto;padding:8px 10px}
    .rm-accions .rm-btn{min-width:44px}
  }

  /* ═══ LA RECEPTA IMPRESA (§8) · mil·límetres i tinta negra ═════════════ */
  .rm-full{position:relative;width:210mm;height:148mm;background:#fff;overflow:hidden;color:#000;
    font-family:"Inter","Segoe UI",Arial,Helvetica,sans-serif;font-variant-numeric:proportional-nums;
    font-size:10pt;line-height:normal;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rm-full.rm-a4{height:297mm}
  .rm-impres{width:210mm}
  .rm-contingut{position:absolute;inset:0}
  /* ENG-41 (A2 §1 i §2) · DOS COSSOS, sempre junts: la recepta i el full
     d'informacio per al pacient. Cada cos fa 210 × 148 mm i les seves zones es
     posen en mm des del seu angle; a l'A4, el del pacient comença a 148,5 mm. */
  .rm-cos{position:absolute;left:0;top:0;width:210mm;height:148mm}
  .rm-a4 .rm-cos-pacient{top:148.5mm;height:148.5mm}
  .rm-z{position:absolute;color:#000}
  .rm-1l{white-space:nowrap}
  /* DIS-16 §4 · 94 mm (era 100): el carrero amb la consulta passa d'1 a 7 mm */
  .rm-z-metge{left:12mm;top:10mm;width:94mm}
  /* DIS-16 §3 · el nom del metge, en negreta i prou: la Inter no te versaletes i el
     navegador les falsificaria (el nom encongiria un 20 %) */
  .rm-l-nom{font-size:12pt;font-weight:700;letter-spacing:.01em;line-height:5.2mm}
  .rm-l-esp{font-size:10pt;line-height:4.4mm}
  .rm-l-extra{font-size:9.5pt;line-height:4.2mm}
  .rm-l-col{font-size:10pt;line-height:4.4mm}
  .rm-z-consulta{right:12mm;top:10mm;width:85mm;text-align:right}
  .rm-l-cnom{font-size:10pt;font-weight:700;line-height:4.4mm}
  .rm-l-l{font-size:10pt;line-height:4.4mm}
  .rm-l-mail{font-size:9.5pt;line-height:4.2mm}
  .rm-z-pacient{left:30mm;top:40mm;width:150mm;text-align:center}
  .rm-p-nom{font-size:15pt;line-height:6.5mm}
  .rm-p-dades{font-size:10pt;line-height:4.4mm;margin-top:1mm}
  .rm-z-medicament{left:20mm;top:63mm;width:170mm;text-align:center}
  .rm-m-principi{font-size:14pt;font-weight:600;line-height:6.2mm}
  .rm-m-detall{font-size:9.5pt;line-height:4.2mm;margin-top:.8mm}
  .rm-z-posologia{left:20mm;top:78mm;width:170mm;text-align:center;font-size:13pt;line-height:5.6mm;white-space:pre-line}
  .rm-z-signatura{left:65mm;top:94mm;width:80mm;height:28mm}
  /* 7 i 8 · la data i, sota la data, la clausula de proteccio de dades (A2 §3:
     23_ §6.2 i §6.3), apilades arran del limit de baix de la zona segura (138 mm).
     Si la clausula hi cap sota la data, la data es queda a 126 mm, on la va posar
     en Roger; si no, la pila creix cap amunt. Es provisional fins a DIS-17 (P-ENG-96). */
  .rm-peu{position:absolute;left:12mm;right:12mm;bottom:10mm;min-height:12mm;display:flex;flex-direction:column;align-items:flex-end}
  .rm-peu .rm-z{position:static}
  .rm-z-data{width:70mm;text-align:right}
  .rm-d-dia{font-size:12pt;line-height:5.4mm}
  /* 23_ §6.3 · 6 pt, interlineat 2,4 mm, en negre, a l'esquerra: l'UNICA excepcio al
     minim de 8,6 pt (es text fix, no el que escriu el metge). Mai mes petita i mai
     tallada: si no hi cap, es un error de validacio, no un retall. */
  .rm-z-clausula{width:186mm;margin-top:.8mm;font-size:6pt;line-height:2.4mm;text-align:left;overflow-wrap:anywhere;color:#000}
  /* el full del pacient (A2 §1): la mateixa capçalera; la resta, provisional fins a DIS-17 */
  .rm-z-ftitol{left:12mm;top:37mm;width:186mm;text-align:center;font-size:12pt;font-weight:700;line-height:5.4mm}
  .rm-z-fpacient{left:30mm;top:46mm;width:150mm;text-align:center}
  .rm-z-ftractament{left:20mm;top:58mm;width:170mm;text-align:center}
  .rm-z-fposologia{left:20mm;top:73mm;width:170mm;text-align:center;font-size:13pt;line-height:5.6mm;white-space:pre-line}
  .rm-z-fvalidesa{left:20mm;top:91mm;width:170mm;text-align:center;font-size:10pt;line-height:4.4mm}
  .rm-marca-prova{position:absolute;left:105mm;top:77mm;transform:translate(-50%,-50%) rotate(-18deg);font-size:34pt;font-weight:800;letter-spacing:.06em;color:rgba(0,0,0,.20);white-space:nowrap;pointer-events:none}
  .rm-marca-anullada{position:absolute;left:105mm;top:74mm;transform:translate(-50%,-50%) rotate(-18deg);font-size:46pt;font-weight:800;letter-spacing:.08em;color:rgba(0,0,0,.30);white-space:nowrap;pointer-events:none;border:1.2mm solid rgba(0,0,0,.30);padding:1mm 6mm}
  .rm-capcalera .rm-z-metge,.rm-capcalera .rm-z-consulta{display:none}
  .rm-tall{position:absolute;left:0;right:0;top:148.5mm;border-top:.3mm dashed rgba(0,0,0,.55)}
  .rm-desborda{outline:.4mm dashed #000;outline-offset:.4mm}
  /* el full d'alineacio: marcs de les 7 zones, creus i el rotul */
  .rm-alineacio .rm-z{outline:.3mm dashed #000;outline-offset:0;display:flex;align-items:center;justify-content:center}
  .rm-alineacio .rm-z-metge{height:22.4mm}
  .rm-alineacio .rm-z-consulta{height:22mm}
  .rm-alineacio .rm-z-pacient{height:11.9mm}
  .rm-alineacio .rm-z-medicament{height:11.2mm}
  .rm-alineacio .rm-z-posologia{height:11.2mm}
  .rm-alineacio .rm-z-data{height:5.4mm}
  .rm-alineacio .rm-z-clausula{height:7.2mm}
  .rm-alineacio .rm-z-ftitol{height:5.4mm}
  .rm-alineacio .rm-z-fpacient{height:6.5mm}
  .rm-alineacio .rm-z-ftractament{height:11.2mm}
  .rm-alineacio .rm-z-fposologia{height:11.2mm}
  .rm-alineacio .rm-z-fvalidesa{height:8.8mm}
  .rm-alineacio.rm-capcalera .rm-z-metge,.rm-alineacio.rm-capcalera .rm-z-consulta{display:flex}
  .rm-alineacio .rm-a-nom{font-size:9pt}
  .rm-a-rotul.rm-a-rotul-p{top:104mm}
  .rm-a-nom{font-size:9pt;line-height:4mm;padding:0 1mm;text-align:center;white-space:nowrap}
  .rm-creu{position:absolute;width:0;height:0}
  .rm-creu::before{content:"";position:absolute;left:-4mm;top:-.15mm;width:8mm;border-top:.3mm solid #000}
  .rm-creu::after{content:"";position:absolute;top:-4mm;left:-.15mm;height:8mm;border-left:.3mm solid #000}
  .rm-creu span{position:absolute;font-size:9pt;line-height:4mm;white-space:nowrap;color:#000}
  .rm-creu-1{left:12mm;top:10mm}.rm-creu-1 span{left:1.5mm;top:1mm}
  .rm-creu-2{left:198mm;top:10mm}.rm-creu-2 span{right:1.5mm;top:1mm}
  .rm-creu-3{left:105mm;top:74mm}.rm-creu-3 span{left:1.5mm;top:1mm}
  .rm-creu-4{left:12mm;top:138mm}.rm-creu-4 span{left:1.5mm;bottom:1mm}
  .rm-creu-5{left:198mm;top:138mm}.rm-creu-5 span{right:1.5mm;bottom:1mm}
  .rm-a-rotul{position:absolute;left:105mm;top:54mm;transform:translateX(-50%);font-size:13pt;font-weight:700;letter-spacing:.04em;white-space:nowrap;color:#000}

  /* el contenidor d'impressio: a pantalla, maquetat pero invisible (es pot
     mesurar); al paper, l'unica cosa que hi ha */
  #rm-impressio,#rm-mesura{position:absolute;left:-10000mm;top:0;visibility:hidden;pointer-events:none}
  @media print{
    html,body{background:#fff!important;margin:0!important;padding:0!important;min-height:0!important}
    body > *:not(#rm-impressio){display:none!important}
    #rm-impressio{position:static;left:auto;visibility:visible}
    #rm-impressio .rm-full{break-inside:avoid;page-break-inside:avoid}
    #rm-impressio .rm-full+.rm-full{break-before:page;page-break-before:always}
    .rm-desborda{outline:0}
  }
</style>
</head>
<body>
<nav class="rm-nav" aria-label="ReceptaMed"><div class="rm-nav-in">
  <span class="rm-logo"><img class="rm-logo-img" src="receptamed.png" alt="ReceptaMed"></span>
  <div class="rm-nav-dreta">
    <a class="rm-nav-enllac" href="hub.html">◀ Panel</a>
    <label for="rm-idioma-ui" class="rm-ocult" data-t="idioma_ui">Idioma de la pantalla</label>
    <select id="rm-idioma-ui" class="rm-idioma">
      <option value="ca">Català</option><option value="es">Español</option><option value="de">Deutsch</option><option value="en">English</option>
    </select>
  </div>
</div></nav>

<main id="rm-main" class="rm-wrap"></main>

<!-- ═══════════════════════════════════════════════════════════════════════
     L'APLICACIO. Es una plantilla inert: NO es al DOM fins que la porta de
     previsualitzacio (§9.2) i el rol (§6.5) ho permeten. Amb la porta tancada
     o amb rol de recepcio, la plantilla s'esborra sense haver-se clonat mai.
     ═══════════════════════════════════════════════════════════════════════ -->
<template id="rm-app">
  <div id="rm-banner" class="rm-banner" role="status" aria-live="polite" hidden></div>

  <!-- ENG-41 (A2 §4) · l'avis del model i de la responsabilitat (23_ §7.3), UNA
       vegada en obrir ReceptaMed per primer cop: queda vist (rm_config.avisModelVist)
       quan el metge prem «Entesos». No tapa res: es pot treballar igualment. -->
  <div id="rm-avis-model-primer" class="rm-avis-fix rm-primer" role="region" aria-labelledby="rm-amp-tit" hidden>
    <p id="rm-amp-tit" class="rm-primer-tit" data-t="amp_tit">Abans de començar</p>
    <p data-tr="avis_model"></p>
    <div class="rm-botons"><button type="button" class="rm-btn sec mini" id="b-avis-model-entesos" data-t="amp_entesos">Entesos</button></div>
  </div>

  <div class="rm-metge-tria" id="rm-metge-wrap" hidden>
    <label for="rm-metge" data-t="metge_tria">Metge que fa la recepta</label>
    <select id="rm-metge" aria-required="true"></select>
  </div>

  <div class="rm-tabs" role="tablist" data-ta="tabs_aria">
    <button type="button" class="rm-tab" id="tab-nova" role="tab" aria-controls="sec-nova" aria-selected="true" data-t="tab_nova">Nova recepta</button>
    <button type="button" class="rm-tab" id="tab-historial" role="tab" aria-controls="sec-historial" aria-selected="false" tabindex="-1" data-t="tab_historial">Historial</button>
    <button type="button" class="rm-tab" id="tab-dades" role="tab" aria-controls="sec-dades" aria-selected="false" tabindex="-1" data-t="tab_dades">Dades de la recepta</button>
  </div>

  <!-- ═══ NOVA RECEPTA ═══ -->
  <section id="sec-nova" role="tabpanel" aria-labelledby="tab-nova">
    <div class="rm-nova">
      <div>
        <div class="rm-card">
          <h2 data-t="pac_tit">Pacient</h2>
          <div class="rm-pac-cerca-wrap">
            <label for="rm-pac-cerca" data-t="pac_cerca">Cerqueu el pacient (nom o DNI/NIE)</label>
            <input id="rm-pac-cerca" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="rm-pac-llista" aria-autocomplete="list">
            <ul id="rm-pac-llista" class="rm-pac-llista" role="listbox" data-ta="pac_llista" hidden></ul>
          </div>
          <div class="rm-botons"><button type="button" class="rm-btn sec mini" id="b-pac-nou" aria-expanded="false" aria-controls="rm-pac-nou" data-t="pac_nou">+ Pacient nou</button></div>
          <div class="rm-pac-nou" id="rm-pac-nou" hidden>
            <h3 data-t="pn_tit">Fitxa nova</h3>
            <label for="rm-pn-nom" data-t="pn_nom">Nom i cognoms</label>
            <input id="rm-pn-nom" type="text" maxlength="80" autocomplete="off">
            <div class="rm-fila">
              <div><label for="rm-pn-naix" data-t="pac_naix">Data de naixement</label><input id="rm-pn-naix" type="date" min="1900-01-01"></div>
              <div><label for="rm-pn-doc-tipus" data-t="pac_doc_tipus">Document</label>
                <select id="rm-pn-doc-tipus"><option value="DNI" data-t="doc_DNI">DNI</option><option value="NIE" data-t="doc_NIE">NIE</option><option value="PASSAPORT" data-t="doc_PASSAPORT">Passaport (pacient estranger sense DNI ni NIE)</option><option value="REPRESENTANT" data-t="doc_REPRESENTANT">DNI/NIE del pare, de la mare o del representant legal (menor sense document)</option></select></div>
            </div>
            <label for="rm-pn-doc-num" data-t="pac_doc_num">Número del document</label>
            <input id="rm-pn-doc-num" type="text" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false">
            <p id="rm-pn-err" class="rm-avis" role="alert" hidden></p>
            <div class="rm-botons"><button type="button" class="rm-btn mini" id="b-pn-crea" data-t="pn_crea">Crear la fitxa</button><button type="button" class="rm-btn sec mini" id="b-pn-cancel" data-t="pn_cancel">Cancel·lar</button></div>
          </div>

          <label for="rm-pac-nom" data-t="pac_nom">Nom i cognoms del pacient</label>
          <input id="rm-pac-nom" type="text" readonly aria-required="true" autocomplete="off">
          <p id="rm-pac-avis-nom" class="rm-avis-suau" data-t="pac_avis_nom" hidden>Comprovi que hi hagi el nom i els dos cognoms, si en té</p>
          <div class="rm-fila">
            <div><label for="rm-pac-naix" data-t="pac_naix">Data de naixement</label><input id="rm-pac-naix" type="date" min="1900-01-01" aria-required="true"></div>
            <div><label for="rm-pac-doc-tipus" data-t="pac_doc_tipus">Document</label>
              <select id="rm-pac-doc-tipus"><option value="DNI" data-t="doc_DNI">DNI</option><option value="NIE" data-t="doc_NIE">NIE</option><option value="PASSAPORT" data-t="doc_PASSAPORT">Passaport (pacient estranger sense DNI ni NIE)</option><option value="REPRESENTANT" data-t="doc_REPRESENTANT">DNI/NIE del pare, de la mare o del representant legal (menor sense document)</option></select></div>
          </div>
          <label for="rm-pac-doc-num" data-t="pac_doc_num">Número del document</label>
          <input id="rm-pac-doc-num" type="text" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-required="true">
          <label class="rm-check"><input type="checkbox" id="rm-pac-desa" checked><span data-t="pac_desa">Desa la data de naixement i el DNI/NIE a la fitxa del pacient. Són dades administratives i se sincronitzen amb la resta de la fitxa.</span></label>
        </div>

        <div class="rm-card">
          <h2 data-t="med_tit">Medicament</h2>
          <p class="rm-nota" data-t="med_un">Un sol medicament per recepta.</p>
          <label for="rm-principi" data-t="l_principi">Principi actiu o medicament</label>
          <input id="rm-principi" type="text" maxlength="50" aria-required="true" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <div class="rm-fila">
            <div><label for="rm-dosi" data-t="l_dosi">Dosi</label><input id="rm-dosi" type="text" maxlength="40" aria-required="true" placeholder="Ex.: 875/125 mg" data-tp="ph_dosi" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
            <div><label for="rm-forma" data-t="l_forma">Forma farmacèutica</label><input id="rm-forma" type="text" maxlength="40" aria-required="true" placeholder="Ex.: comprimits" data-tp="ph_forma" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
          </div>
          <div class="rm-fila">
            <div><label for="rm-via" data-t="l_via">Via d'administració (si cal)</label><input id="rm-via" type="text" maxlength="18" placeholder="Ex.: oral" data-tp="ph_via" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
            <div><label for="rm-format" data-t="l_format">Format de l'envàs</label><input id="rm-format" type="text" maxlength="40" aria-required="true" placeholder="Ex.: envàs de 30 comprimits" data-tp="ph_format" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
          </div>
          <div class="rm-fila">
            <div><label for="rm-envasos" data-t="l_envasos">Nombre d'envasos</label><input id="rm-envasos" type="number" min="1" max="4" step="1" value="1" inputmode="numeric" aria-required="true" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
          </div>
          <p id="rm-avis-envasos" class="rm-avis" data-t="avis_envasos" hidden>Fins a quatre envasos només en els casos de l'art. 5.5.a) del RD 1718/2010: antibacterians J01 en unidosi per via parenteral (excepte J01E, J01M i J01R), vials multidosi d'insulines A10A i medicaments de diagnòstic hospitalari. Els estupefaents no es poden receptar amb ReceptaMed.</p>
          <label for="rm-posologia" data-t="l_posologia">Posologia</label>
          <textarea id="rm-posologia" rows="2" maxlength="140" aria-required="true" aria-describedby="rm-posologia-ajuda" placeholder="Ex.: 1 comprimit cada 12 hores durant 10 dies" data-tp="ph_posologia" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
          <p id="rm-posologia-ajuda" class="rm-ajuda" data-t="ajuda_posologia">Unitats per presa, freqüència i durada del tractament</p>
          <!-- ENG-41 (A2 §4) · 23_ §4.8, literal i FIX: no detecta res (no hi ha cap llista de fàrmacs) -->
          <p id="rm-avis-estupefaents" class="rm-avis-fix" role="note" data-t="avis_estupefaents">ReceptaMed no serveix per receptar estupefaents ni productes sanitaris. Els estupefaents de la llista I es prescriuen en la recepta oficial d'estupefaents, que es demana al Col·legi de Metges i s'omple a mà (RD 1675/2012). Un producte sanitari no pot anar a la mateixa recepta que un medicament (art. 13 del RD 1718/2010).</p>

          <div id="rm-errors" class="rm-errors" role="alert" hidden><p data-t="err_tit">No s'ha imprès res. Falta o no és correcte:</p><ul id="rm-errors-llista"></ul></div>
          <div class="rm-botons">
            <button type="button" class="rm-btn" id="b-imprimir-recepta" data-t="b_imprimir">Imprimir la recepta</button>
            <button type="button" class="rm-btn sec" id="b-netejar" data-t="b_netejar">Començar de nou</button>
          </div>
          <div id="rm-desada" class="rm-ok" role="status" hidden><span data-t="desada">Recepta desada a l'historial</span></div>
          <p id="rm-desada-nota" class="rm-ajuda" data-t="desada_cancel" hidden>Si heu cancel·lat la impressió, la podeu anul·lar des de l'historial.</p>
          <div class="rm-botons"><button type="button" class="rm-btn sec" id="b-una-altra" data-t="b_una_altra" hidden>Una altra recepta per al mateix pacient</button></div>
        </div>
      </div>

      <div class="rm-card rm-previ-card">
        <h2 data-t="previ_tit">Previsualització</h2>
        <div id="rm-previsualitzacio" class="rm-previ" role="img" data-ta="previ_aria"></div>
        <p class="rm-ajuda" id="rm-previ-paper"></p>
      </div>
    </div>
  </section>

  <!-- ═══ HISTORIAL ═══ -->
  <section id="sec-historial" role="tabpanel" aria-labelledby="tab-historial" hidden>
    <div class="rm-card">
      <div class="rm-filtres">
        <div><label for="rm-h-cerca" data-t="h_cerca">Cerca (pacient, medicament o dosi)</label><input id="rm-h-cerca" type="search" autocomplete="off" spellcheck="false"></div>
        <div><label for="rm-h-des" data-t="h_des">Des de</label><input id="rm-h-des" type="date"></div>
        <div><label for="rm-h-fins" data-t="h_fins">Fins a</label><input id="rm-h-fins" type="date"></div>
      </div>
      <label class="rm-check"><input type="checkbox" id="rm-h-anullades"><span data-t="h_anullades">Mostra també les anul·lades</span></label>
      <div class="rm-export">
        <button type="button" class="rm-btn sec mini" id="b-exporta-csv" data-t="b_csv">Exportar en CSV</button>
        <button type="button" class="rm-btn sec mini" id="b-exporta-json" data-t="b_json">Còpia en JSON</button>
      </div>
      <p class="rm-compte" id="rm-h-compte" aria-live="polite"></p>
      <table class="rm-taula" id="rm-h-taula">
        <thead><tr><th scope="col" data-t="h_col_data">Data</th><th scope="col" data-t="h_col_pacient">Pacient</th><th scope="col" data-t="h_col_med">Medicament</th><th scope="col" data-t="h_col_pos">Posologia</th><th scope="col" data-t="h_col_estat">Estat</th><th scope="col" data-t="h_col_acc">Accions</th></tr></thead>
        <tbody id="rm-h-files"></tbody>
      </table>
      <p class="rm-buit" id="rm-h-buit" hidden></p>
    </div>
  </section>

  <!-- ═══ DADES DE LA RECEPTA ═══ -->
  <section id="sec-dades" role="tabpanel" aria-labelledby="tab-dades" hidden>
    <!-- ENG-41 (A2 §4) · 23_ §7.3, literal: sempre, a «Dades de la recepta» -->
    <div id="rm-avis-model" class="rm-avis-fix" role="note" data-tr="avis_model"></div>
    <div id="rm-avis-dades" class="rm-avis" role="alert" hidden></div>
    <div id="rm-d-errors" class="rm-errors" role="alert" hidden><p id="rm-d-errors-tit" data-t="d_err_tit">No s'han desat les dades. Cal corregir:</p><ul id="rm-d-errors-llista"></ul></div>
    <div class="rm-dades">
      <div class="rm-card">
        <h2 data-t="d_metge_tit">Metge</h2>
        <p class="rm-nota" id="rm-d-metge-de" hidden></p>
        <p class="rm-avis" id="rm-d-metge-cap" data-t="d_metge_cap" hidden>Trieu el metge a dalt de tot per escriure les seves dades.</p>
        <label for="rm-d-tractament" data-t="d_tractament">Tractament</label>
        <select id="rm-d-tractament"><option value="" data-t="d_tractament_cap">(cap)</option><option value="Dr.">Dr.</option><option value="Dra.">Dra.</option></select>
        <label for="rm-d-nom" data-t="d_nom">Nom i dos cognoms *</label>
        <input id="rm-d-nom" type="text" maxlength="80" aria-required="true" autocomplete="off">
        <label for="rm-d-especialitat" data-t="d_especialitat">Especialitat oficialment acreditada *</label>
        <input id="rm-d-especialitat" type="text" maxlength="80" aria-required="true" autocomplete="off">
        <label for="rm-d-extra1" data-t="d_extra1">Línia addicional 1 (opcional)</label>
        <input id="rm-d-extra1" type="text" maxlength="60" autocomplete="off">
        <label for="rm-d-extra2" data-t="d_extra2">Línia addicional 2 (opcional)</label>
        <input id="rm-d-extra2" type="text" maxlength="60" autocomplete="off">
        <label for="rm-d-colegiat" data-t="d_colegiat">Número de col·legiat *</label>
        <input id="rm-d-colegiat" type="text" maxlength="20" aria-required="true" autocomplete="off" spellcheck="false">
      </div>
      <div class="rm-card">
        <h2 data-t="d_consulta_tit">Consulta</h2>
        <label for="rm-d-cnom" data-t="d_cnom">Nom de la consulta o del centre (opcional)</label>
        <input id="rm-d-cnom" type="text" maxlength="80" autocomplete="off">
        <label for="rm-d-linia1" data-t="d_linia1">Adreça: carrer i número *</label>
        <input id="rm-d-linia1" type="text" maxlength="80" aria-required="true" autocomplete="off">
        <label for="rm-d-linia2" data-t="d_linia2">Codi postal i població *</label>
        <input id="rm-d-linia2" type="text" maxlength="80" aria-required="true" autocomplete="off">
        <label for="rm-d-telefon" data-t="d_telefon">Telèfon *</label>
        <input id="rm-d-telefon" type="tel" maxlength="30" aria-required="true" aria-describedby="rm-d-telefon-ajuda" autocomplete="off">
        <p class="rm-ajuda" id="rm-d-telefon-ajuda" data-t="d_telefon_ajuda">Sense prefix, s'hi afegeix +34 (9 xifres). D'un altre país, escriviu-lo amb el prefix (+33…).</p>
        <label for="rm-d-correu" data-t="d_correu">Correu electrònic *</label>
        <input id="rm-d-correu" type="email" maxlength="120" aria-required="true" autocomplete="off" spellcheck="false">
      </div>
      <div class="rm-card">
        <h2 data-t="d_paper_tit">Paper</h2>
        <fieldset>
          <legend data-t="d_paper_llegenda">On s'imprimeix la recepta</legend>
          <label class="rm-radio"><input type="radio" name="rm-paper" id="rm-d-paper-a4" value="A4_TALL"><span data-t="d_paper_A4">A4: la recepta a dalt i el full d'informació per al pacient a baix, amb una línia per tallar (per defecte)</span></label>
          <label class="rm-radio"><input type="radio" name="rm-paper" id="rm-d-paper-a5" value="A5"><span data-t="d_paper_A5">Mig A4 (A5) en horitzontal: la recepta i el full d'informació per al pacient, en dos fulls</span></label>
          <label class="rm-radio"><input type="radio" name="rm-paper" id="rm-d-paper-capcalera" value="CAPCALERA"><span data-t="d_paper_CAP">Paper amb la capçalera ja impresa: la recepta i el full d'informació per al pacient, en dos fulls</span></label>
        </fieldset>
        <p class="rm-ajuda" id="rm-d-paper-ajuda" data-t="d_paper_ajuda">La recepta surt sempre amb el full d'informació per al pacient: l'A4, en un sol full; l'A5 i el paper amb capçalera, en dos.</p>
        <p id="rm-d-avis-capcalera" class="rm-avis" data-t="d_avis_capcalera" hidden>Feu servir el full d'alineació per ajustar-ho al vostre paper</p>
        <h3 data-t="d_calib_tit">Calibratge</h3>
        <div class="rm-fila">
          <div><label for="rm-d-dx" data-t="d_dx">Desplaçament horitzontal (mm)</label><input id="rm-d-dx" type="number" min="-6" max="6" step="0.5" value="0" inputmode="decimal" aria-describedby="rm-d-calib-ajuda"></div>
          <div><label for="rm-d-dy" data-t="d_dy">Desplaçament vertical (mm)</label><input id="rm-d-dy" type="number" min="-6" max="6" step="0.5" value="0" inputmode="decimal" aria-describedby="rm-d-calib-ajuda"></div>
        </div>
        <p class="rm-ajuda" id="rm-d-calib-ajuda" data-t="d_calib_ajuda">De −6 a 6 mm, de 0,5 en 0,5. Positiu: cap a la dreta i cap avall.</p>
        <p id="rm-d-avis-marge" class="rm-avis" role="status" data-t="d_avis_marge" hidden>Amb aquest desplaçament, part del text entra al marge de seguretat (12 mm als costats, 10 mm a dalt i a baix). Comproveu-ho amb el full d'alineació.</p>

  /* §6.5 · recepcio i administracio del centre: res mes que aixo. */
  function pintaNomesMetge() { pantallaSenzilla('rm-nomes-metge', 'rol_tit', false); }
  function pintaCarregant() { var m = $('rm-main'); m.textContent = ''; var p = el('p', 'rm-carregant'); p.setAttribute('data-t', 'carregant'); m.appendChild(p); pintaTextos(m); }
  function treuPlantilla() { var tp = $('rm-app'); if (tp && tp.parentNode) tp.parentNode.removeChild(tp); }

  /* §6.5 · EL ROL, sense cap sonda de mes (ENG-22: com a molt una per carrega).
     cmsync.js ja pregunta `jo` si pot haver-hi sessio (cmStore.potHaverSessio);
     si ha decidit no preguntar, aqui tampoc: el rol es desconegut i la pagina va
     sencera. Si ha preguntat, cmSync.jo() torna la MATEIXA promesa. */
  var nomSessio = null, appActiva = false;
  function rolDe(r) {
    if (!r || !r.ok || !r.usuari) return null;
    nomSessio = r.usuari.nom || null;
    var os = r.usuari.organitzacions || [], org = null, o = null;
    try { org = window.cmSync && cmSync.org ? cmSync.org() : null; } catch (e) {}
    for (var i = 0; i < os.length; i++) if (os[i] && os[i].id === org) o = os[i];
    if (!o) o = os[0] || null;
    return o ? (o.rol || null) : null;
  }
  function decideixRol(cb) {
    var fet = false;
    function acaba(rol) {
      if (!fet) { fet = true; cb(rol); return; }
      /* La resposta ha arribat tard (després del temps d'espera): si diu que no
         és metge, es desmunta el que s'havia pintat. */
      if (ROLS_SENSE_RECEPTA.indexOf(rol) >= 0) { desmuntaApp(); pintaNomesMetge(); }
      else if (appActiva) preparaCentre();
    }
    var st = window.cmStore || {};
    if (!window.cmSync || typeof cmSync.jo !== 'function' || (st.potHaverSessio && !st.potHaverSessio())) { acaba(null); return; }
    var p = null;
    try { p = cmSync.jo(); } catch (e) { p = null; }
    if (!p || typeof p.then !== 'function') { acaba(null); return; }
    pintaCarregant();
    var espera = setTimeout(function () { acaba(null); }, 6000);
    p.then(function (r) { clearTimeout(espera); acaba(rolDe(r)); }, function () { clearTimeout(espera); acaba(null); });
  }
  function desmuntaApp() {
    appActiva = false;
    var ids = ['rm-impressio', 'rm-mesura'];
    ids.forEach(function (id) { var e = $(id); if (e && e.parentNode) e.parentNode.removeChild(e); });
    var b = $('barra-prova'); if (b) b.style.display = 'none';
    $('rm-main').textContent = '';
  }

  function arrenca() {
    document.documentElement.lang = ui;

    pintaTextos(nav);
    var sel = $('rm-idioma-ui');
    sel.value = ui;
    sel.addEventListener('change', function () { canviaIdioma(sel.value); });
    if (!portaOberta()) { treuPlantilla(); pintaNeutra(); return; }
    decideixRol(function (rol) {
      if (ROLS_SENSE_RECEPTA.indexOf(rol) >= 0) { treuPlantilla(); pintaNomesMetge(); return; }
      iniciaApp();
    });
  }
  function canviaIdioma(l) {
    if (IDIOMES_UI.indexOf(l) < 0) return;
    ui = l;
    try { localStorage.setItem('em_idioma_ui', l); } catch (e) {}
    document.documentElement.lang = l;
    pintaTextos(document.body);
    if (appActiva) {
      amagaErrors();
      pintaSelectorMetges();
      pintaDadesMetgeDe();
      pintaHistorial();
      pintaPrevi();
      pintaAvisDades();
      vigilaDades();
      vigilaMarge();
      barra();
    }
  }

  /* ═══════════════════════ L'APLICACIÓ ═══════════════════════ */
  var E = {

    metges: [],
    metge: '',          /* clau del metge triat en mode centre */
    origen: null,       /* id de la recepta que s'esta repetint */

    var imp = el('div'); imp.id = 'rm-impressio'; imp.setAttribute('aria-hidden', 'true'); document.body.appendChild(imp);
    var mes = el('div'); mes.id = 'rm-mesura'; mes.setAttribute('aria-hidden', 'true'); document.body.appendChild(mes);
    appActiva = true;

    E.cfg = carregaCfg();

    preparaCentre(true);
    restauraEsborrany();

    if (dadesErrors().length) obrePestanya('dades'); else obrePestanya('nova');
    pintaAvisDades();
    /* A2 §4 · 23_ §7.3, UNA vegada en obrir ReceptaMed per primer cop */
    $('rm-avis-model-primer').hidden = !!E.cfg.avisModelVist;
  }
  function entesosAvisModel() {
    $('rm-avis-model-primer').hidden = true;
    var cfg = clona(E.cfg); cfg.avisModelVist = true;
    try { escriu(K.cfg, cfg); E.cfg = normalitzaCfg(cfg); } catch (e) {}   /* si no es pot desar, sortira una altra vegada */
  }

  /* ─────────── rm_config (§5.1) ─────────── */
  function metgeBuit(nom) { return { tractament: '', nom: nom || '', especialitat: '', extra: ['', ''], colegiat: '' }; }
  function canonMetge(m) {
    m = m || {};
    var ex = Array.isArray(m.extra) ? m.extra : [];
    var tr = (m.tractament === 'Dr.' || m.tractament === 'Dra.') ? m.tractament : '';
    return { tractament: tr, nom: String(m.nom || '').trim(), especialitat: String(m.especialitat || '').trim(), extra: [String(ex[0] || '').trim(), String(ex[1] || '').trim()], colegiat: String(m.colegiat || '').trim() };
  }
  function canonConsulta(c) {
    c = c || {};
    return { nom: String(c.nom || '').trim(), linia1: String(c.linia1 || '').trim(), linia2: String(c.linia2 || '').trim(), telefon: String(c.telefon || '').trim(), correu: String(c.correu || '').trim() };
  }
  function despl(v) { var n = Number(v); if (!isFinite(n)) return 0; n = Math.round(n * 2) / 2; return Math.max(-DESPL_MAX, Math.min(DESPL_MAX, n)); }
  function desplMal(v) { return !isFinite(v) || v < -DESPL_MAX || v > DESPL_MAX || Math.round(v * 2) !== v * 2; }
  function normalitzaCfg(c) {
    c = (c && typeof c === 'object') ? c : {};
    var o = {
      versio: 1,
      paper: PAPERS.indexOf(c.paper) >= 0 ? c.paper : PAPER_DEFECTE,
      despl: { x: despl(c.despl && c.despl.x), y: despl(c.despl && c.despl.y) },
      idioma: c.idioma === 'es' ? 'es' : 'ca',
      consulta: canonConsulta(c.consulta),
      metges: {},
      avisModelVist: c.avisModelVist === true                /* A2 §4: l'avis de 23_ §7.3 ja s'ha vist */
    };
    var ms = (c.metges && typeof c.metges === 'object') ? c.metges : {};
    Object.keys(ms).forEach(function (k) { o.metges[k] = canonMetge(ms[k]); });
    return o;
  }
  /* El primer cop, des de fm2_config (FacturaMed): nom, col·legiat i l'adreça
     partida pel « — ». Des d'aqui, rm_config es independent. */
  function carregaCfg() {
    var c = llegeix(K.cfg, null);
    if (c && typeof c === 'object') return normalitzaCfg(c);
    var fm = llegeix(KF.conf, {}) || {};
    var n = normalitzaCfg({});
    var tit = metgeBuit(String(fm.nom || '').trim());
    tit.colegiat = String(fm.colegiat || '').trim();
    n.metges.titular = tit;
    var adr = String(fm.adreca || '').trim(), i = adr.indexOf(' \u2014 ');
    if (i >= 0) { n.consulta.linia1 = adr.slice(0, i).trim(); n.consulta.linia2 = adr.slice(i + 3).trim(); }
    else n.consulta.linia1 = adr;
    try { escriu(K.cfg, n); } catch (e) {}
    return n;
  }

  /* ─────────── mode centre (§6.1) ─────────── */
  function preparaCentre(primerCop) {
    var fm = llegeix(KF.conf, {}) || {};
    var cen = fm.centre || {};
    var ms = (cen.actiu && Array.isArray(cen.metges)) ? cen.metges.filter(function (x) { return typeof x === 'string' && x.trim(); }) : [];
    E.centre = !!(cen.actiu && ms.length);
    E.metges = ms;
    $('rm-metge-wrap').hidden = !E.centre;
    if (!E.centre) { E.metge = 'titular'; return; }
    var abans = E.metge;
    if (primerCop || !abans || E.metges.indexOf(abans) < 0) {
      var g = null;
      try { g = localStorage.getItem(K.metge); } catch (e) {}
      if (nomSessio && E.metges.indexOf(nomSessio) >= 0) E.metge = nomSessio;
      else if (g && E.metges.indexOf(g) >= 0) E.metge = g;
      else E.metge = '';
    }
    pintaSelectorMetges();
    if (!primerCop && abans !== E.metge) canviMetge();
  }
  function pintaSelectorMetges() {
    if (!E.centre) return;
    var s = $('rm-metge'); s.textContent = '';
    var o0 = el('option'); o0.value = ''; o0.textContent = t('metge_tria_buit'); s.appendChild(o0);
    E.metges.forEach(function (m) { var o = el('option'); o.value = m; o.textContent = m; s.appendChild(o); });
    s.value = E.metge;
  }
  function clauMetge() { return E.centre ? E.metge : 'titular'; }
  function metgeCfg() {
    var k = clauMetge();
    if (!k) return metgeBuit('');
    return E.cfg.metges[k] ? E.cfg.metges[k] : metgeBuit(E.centre ? k : '');
  }
  function canviMetge() {
    if (E.centre && E.metge) { try { localStorage.setItem(K.metge, E.metge); } catch (e) {} }
    pintaDades();
    pintaHistorial();
    pintaPrevi();
    pintaAvisDades();
    programaEsborrany();
    if (E.centre && E.metge && dadesErrors().length) obrePestanya('dades');
  }

  /* ─────────── validacio de les dades del metge i la consulta (§7.3, §7.4) ─────────── */
  function normalitzaTelefon(s) {
    s = String(s || '').trim();
    if (!s) return { ok: false, err: 'falta' };
    var valor;
    if (s.charAt(0) === '+' || s.slice(0, 2) === '00') {
      valor = '+' + (s.charAt(0) === '+' ? s.slice(1) : s.slice(2)).trim();
    } else {
      var net = s.replace(/[^\d ]/g, '').trim();
      if (net.replace(/\D/g, '').length !== 9) return { ok: false, err: 'prefix' };
      valor = '+34 ' + net;
    }
    var n = valor.replace(/\D/g, '').length;
    if (n < 8 || n > 15) return { ok: false, err: 'xifres' };
    return { ok: true, valor: valor };
  }
  var ETIQ = {
    'rm-d-nom': 'd_nom', 'rm-d-especialitat': 'd_especialitat', 'rm-d-extra1': 'd_extra1', 'rm-d-extra2': 'd_extra2',
    'rm-d-colegiat': 'd_colegiat', 'rm-d-cnom': 'd_cnom', 'rm-d-linia1': 'd_linia1', 'rm-d-linia2': 'd_linia2',
    'rm-d-telefon': 'd_telefon', 'rm-d-correu': 'd_correu', 'rm-d-dx': 'd_dx', 'rm-d-dy': 'd_dy',
    'rm-pac-naix': 'pac_naix', 'rm-pac-doc-num': 'pac_doc_num', 'rm-pac-nom': 'pac_nom',
    'rm-principi': 'l_principi', 'rm-dosi': 'l_dosi', 'rm-forma': 'l_forma', 'rm-via': 'l_via', 'rm-format': 'l_format',
    'rm-envasos': 'l_envasos', 'rm-posologia': 'l_posologia'
  };
  function etiq(id) { return t(ETIQ[id] || id).replace(/\s*\*$/, ''); }
  /* Els errors de les dades: amb `formats` nomes els de forma (per desar); sense,
     tambe els que falten (per imprimir). */
  function dadesErrors(m, c, nomesFormats) {
    m = m || (E.centre && !E.metge ? null : metgeCfg());
    c = c || E.cfg.consulta;
    var e = [];
    function falta(id) { e.push({ id: id, msg: t('err_falta_dades', { camp: etiq(id) }), dades: true }); }
    function mal(id, k, x) { e.push({ id: id, msg: t(k, Object.assign({ camp: etiq(id) }, x || {})), dades: true }); }
    if (m) {
      if (!m.nom) { if (!nomesFormats) falta('rm-d-nom'); } else if (m.nom.length > MAX.nom) mal('rm-d-nom', 'err_llarg', { n: MAX.nom });
      if (!m.especialitat) { if (!nomesFormats) falta('rm-d-especialitat'); } else if (m.especialitat.length > MAX.especialitat) mal('rm-d-especialitat', 'err_llarg', { n: MAX.especialitat });
      if (m.extra[0].length > MAX.extra) mal('rm-d-extra1', 'err_llarg', { n: MAX.extra });
      if (m.extra[1].length > MAX.extra) mal('rm-d-extra2', 'err_llarg', { n: MAX.extra });
      if (!m.colegiat) { if (!nomesFormats) falta('rm-d-colegiat'); }
      else if (m.colegiat.length > MAX.colegiat) mal('rm-d-colegiat', 'err_llarg', { n: MAX.colegiat });
      else if (!/\d/.test(m.colegiat)) mal('rm-d-colegiat', 'err_colegiat');
    }
    if (c.nom.length > MAX.cnom) mal('rm-d-cnom', 'err_llarg', { n: MAX.cnom });
    if (!c.linia1) { if (!nomesFormats) falta('rm-d-linia1'); } else if (c.linia1.length > MAX.linia) mal('rm-d-linia1', 'err_llarg', { n: MAX.linia });
    if (!c.linia2) { if (!nomesFormats) falta('rm-d-linia2'); } else if (c.linia2.length > MAX.linia) mal('rm-d-linia2', 'err_llarg', { n: MAX.linia });
    if (!c.telefon) { if (!nomesFormats) falta('rm-d-telefon'); }
    else { var tn = normalitzaTelefon(c.telefon); if (!tn.ok) mal('rm-d-telefon', tn.err === 'prefix' ? 'err_tel_prefix' : 'err_tel_xifres'); }
    if (!c.correu) { if (!nomesFormats) falta('rm-d-correu'); }
    else if (!RE_CORREU.test(c.correu) || c.correu.length > MAX.correu) mal('rm-d-correu', 'err_correu');
    return e;
  }

  /* ─────────── pestanyes ─────────── */
  var PESTANYES = ['nova', 'historial', 'dades'];
  function obrePestanya(nom, focus) {
    PESTANYES.forEach(function (p) {
      var tb = $('tab-' + p), sc = $('sec-' + p), act = p === nom;
      tb.setAttribute('aria-selected', act ? 'true' : 'false');
      tb.tabIndex = act ? 0 : -1;
      sc.hidden = !act;
    });
    if (focus) $('tab-' + nom).focus();
    if (nom === 'nova') pintaPrevi();
    if (nom === 'historial') pintaHistorial();
    if (nom === 'dades') { pintaAvisDades(); }
  }

  /* ─────────── avisos ─────────── */
  var tBanner = null;
  function banner(tipus, msg) {
    var b = $('rm-banner'); if (!b) return;
    b.className = 'rm-banner ' + tipus; b.textContent = msg; b.hidden = false;
    clearTimeout(tBanner);
    tBanner = setTimeout(function () { b.hidden = true; }, 9000);
  }
  function pintaAvisDades() {
    var a = $('rm-avis-dades'); if (!a) return;
    if (E.centre && !E.metge) { a.hidden = true; return; }
    var errs = dadesErrors();
    if (!errs.length) { a.hidden = true; return; }
    a.textContent = t('avis_dades', { llista: errs.map(function (x) { return etiq(x.id); }).join(', ') });
    a.hidden = false;
  }
  function amagaErrors() {
    var e = $('rm-errors'); if (e) e.hidden = true;
    document.querySelectorAll('#sec-nova [aria-invalid="true"],#rm-metge[aria-invalid="true"]').forEach(function (x) { x.removeAttribute('aria-invalid'); });
  }
  function llistaErrors(ul, errs) {
    ul.textContent = '';
    errs.forEach(function (x) {
      var li = el('li'); var b = el('button', 'rm-err-camp'); b.type = 'button'; b.textContent = x.msg;
      b.setAttribute('data-camp', x.id);
      b.addEventListener('click', function () { anaACamp(x.id); });
      li.appendChild(b); ul.appendChild(li);
      var c = $(x.id); if (c && /^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName)) c.setAttribute('aria-invalid', 'true');
    });
  }
  /* §7 · una llista amb CADA camp que falta, i el focus al primer. Si el primer
     és de «Dades de la recepta», la pestanya canvia i la llista d'aquells camps
     s'hi veu tambe (la de «Nova recepta» queda a punt per quan s'hi torni). */
  function mostraErrors(errs, llistaId, cont) {
    llistaErrors($(llistaId || 'rm-errors-llista'), errs);
    $(cont || 'rm-errors').hidden = false;
    if (!llistaId) {
      var dd = errs.filter(function (x) { return /^rm-d-/.test(x.id); });
      var c0 = $(errs[0].id);
      if (dd.length && c0 && c0.closest('#sec-dades')) {
        $('rm-d-errors-tit').setAttribute('data-t', 'err_tit'); $('rm-d-errors-tit').textContent = t('err_tit');
        llistaErrors($('rm-d-errors-llista'), dd);
        $('rm-d-errors').hidden = false;
      }
    } else if (llistaId === 'rm-d-errors-llista') {
      $('rm-d-errors-tit').setAttribute('data-t', 'd_err_tit'); $('rm-d-errors-tit').textContent = t('d_err_tit');
    }
    anaACamp(errs[0].id);
  }
  function anaACamp(id) {
    var c = $(id); if (!c) return;
    var sec = c.closest('section[role="tabpanel"]');
    if (sec) { var nom = sec.id.replace('sec-', ''); if ($('tab-' + nom).getAttribute('aria-selected') !== 'true') obrePestanya(nom); }
    try { c.focus(); } catch (e) {}
  }

  /* ═══════════════════ NOVA RECEPTA: el formulari ═══════════════════ */
  var CAMPS_MED = ['rm-principi', 'rm-dosi', 'rm-forma', 'rm-via', 'rm-format', 'rm-envasos', 'rm-posologia'];
  var CAMPS_PAC = ['rm-pac-nom', 'rm-pac-naix', 'rm-pac-doc-tipus', 'rm-pac-doc-num'];
  function envasos() {
    var v = String($('rm-envasos').value || '').trim();
    if (v === '') return '';
    return /^\d+$/.test(v) ? parseInt(v, 10) : NaN;
  }
  function llegeixFormulari() {
    var tipus = $('rm-pac-doc-tipus').value;
    return {
      pacient: { nom: val('rm-pac-nom'), naixement: val('rm-pac-naix'), doc: { tipus: DOCS.indexOf(tipus) >= 0 ? tipus : 'DNI', num: normDoc($('rm-pac-doc-num').value) } },
      medicament: { principi: val('rm-principi'), dosi: val('rm-dosi'), forma: val('rm-forma'), via: val('rm-via'), format: val('rm-format'), envasos: envasos() },
      posologia: String($('rm-posologia').value || '').trim()
    };
  }
  function formulariBuit() {
    return !CAMPS_PAC.concat(CAMPS_MED).some(function (id) {
      if (id === 'rm-pac-doc-tipus') return false;
      if (id === 'rm-envasos') return val(id) !== '' && val(id) !== '1';
      return val(id) !== '';
    });
  }
  function posaFormulari(e) {
    e = e || {};
    var p = e.pacient || {}, d = p.doc || {}, m = e.medicament || {};
    $('rm-pac-nom').value = p.nom || '';
    $('rm-pac-naix').value = dataValida(p.naixement) ? p.naixement : '';
    $('rm-pac-doc-tipus').value = DOCS.indexOf(d.tipus) >= 0 ? d.tipus : 'DNI';
    $('rm-pac-doc-num').value = d.num || '';
    $('rm-principi').value = m.principi || '';
    $('rm-dosi').value = m.dosi || '';
    $('rm-forma').value = m.forma || '';
    $('rm-via').value = m.via || '';
    $('rm-format').value = m.format || '';
    $('rm-envasos').value = (m.envasos === '' || m.envasos == null) ? '1' : String(m.envasos);
    $('rm-posologia').value = e.posologia || '';
    E.origen = e.origen || null;
    avisNom();
    avisEnvasos();
  }
  function buidaMedicament() {
    ['rm-principi', 'rm-dosi', 'rm-forma', 'rm-via', 'rm-format', 'rm-posologia'].forEach(function (id) { $(id).value = ''; });
    $('rm-envasos').value = '1';
    avisEnvasos();
  }
  function avisNom() {
    var n = val('rm-pac-nom');
    $('rm-pac-avis-nom').hidden = !n || n.split(/\s+/).filter(Boolean).length >= 3;
  }
  /* 23_ §4.7: es dispara per un nombre (els envasos), mai per un medicament */
  function avisEnvasos() { var n = envasos(); $('rm-avis-envasos').hidden = !(n > 1); }

  /* rm_esborrany (§5.4): es desa sol 400 ms despres de l'ultim canvi */
  var tEsb = null;
  function programaEsborrany() { clearTimeout(tEsb); tEsb = setTimeout(desaEsborrany, 400); }
  function desaEsborrany() {
    if (!appActiva || E.emesa) return;
    if (formulariBuit() && !E.origen) { treu(K.esb); return; }
    var f = llegeixFormulari();
    var e = { versio: 1, metgeClau: clauMetge() || null, pacient: f.pacient, medicament: f.medicament, posologia: f.posologia, origen: E.origen || null };
    if (typeof e.medicament.envasos === 'number' && isNaN(e.medicament.envasos)) e.medicament.envasos = '';
    try { escriu(K.esb, e); } catch (x) {}
  }
  function restauraEsborrany() {
    var e = llegeix(K.esb, null);
    if (e && typeof e === 'object') posaFormulari(e);
  }

  /* ─────────── el pacient (§6.2) ─────────── */
  function pacients() { return llista(KF.pac).filter(function (p) { return p && typeof p === 'object' && p.nom; }); }
  function cercaPacients(q) {
    var qs = normal(q).trim(), qn = normDoc(q);

  function desaDades() {

    document.querySelectorAll('#sec-dades [aria-invalid="true"]').forEach(function (x) { x.removeAttribute('aria-invalid'); });
    var senseMetge = E.centre && !E.metge;
    var m = canonMetge({ tractament: $('rm-d-tractament').value, nom: val('rm-d-nom'), especialitat: val('rm-d-especialitat'), extra: [val('rm-d-extra1'), val('rm-d-extra2')], colegiat: val('rm-d-colegiat') });
    var c = canonConsulta({ nom: val('rm-d-cnom'), linia1: val('rm-d-linia1'), linia2: val('rm-d-linia2'), telefon: val('rm-d-telefon'), correu: val('rm-d-correu') });
    var errs = dadesErrors(senseMetge ? null : m, c, true).map(function (x) { return { id: x.id, msg: x.msg }; });
    var dx = Number($('rm-d-dx').value), dy = Number($('rm-d-dy').value);
    [['rm-d-dx', dx], ['rm-d-dy', dy]].forEach(function (x) {
      if (desplMal(x[1])) errs.push({ id: x[0], msg: t('err_despl', { camp: etiq(x[0]) }) });
    });
    if (errs.length) { mostraErrors(errs, 'rm-d-errors-llista', 'rm-d-errors'); return false; }
    /* §7.4 · el telefon es desa normalitzat */
    if (c.telefon) c.telefon = normalitzaTelefon(c.telefon).valor;
    var cfg = clona(E.cfg);
    if (!senseMetge) cfg.metges[clauMetge()] = m;
    cfg.consulta = c;
    cfg.paper = paperTriat();
    cfg.despl = { x: despl(dx), y: despl(dy) };
    cfg.idioma = $('rm-d-idioma').value === 'es' ? 'es' : 'ca';
    cfg = normalitzaCfg(cfg);
    try { escriu(K.cfg, cfg); } catch (e) { banner('err', t('err_desar')); return false; }
    E.cfg = cfg;
    pintaDades();
    pintaAvisDades();
    $('rm-d-alin-nota').hidden = true;
    var falten = senseMetge ? [] : dadesErrors();
    banner('ok', falten.length ? t('d_desades_falten', { llista: falten.map(function (x) { return etiq(x.id); }).join(', ') }) : t('d_desades'));
    return true;
  }

  /* ═══════════════════ HISTORIAL (§6.3) ═══════════════════ */
  function abast() {
    var l = llista(K.rec).filter(function (r) { return r && r.id && r.pacient && r.medicament; });
    if (E.centre) l = l.filter(function (r) { return r.metgeClau === E.metge; });
    return l;
  }
  function pintaHistorial() {
    if (!appActiva || !$('rm-h-files')) return;
    var cos = $('rm-h-files'), buit = $('rm-h-buit'), compte = $('rm-h-compte');
    cos.textContent = '';
    if (E.centre && !E.metge) { buit.textContent = t('h_metge_cap'); buit.hidden = false; compte.textContent = ''; $('rm-h-taula').hidden = true; return; }
    var totes = abast();
    var q = normal(val('rm-h-cerca')), des = val('rm-h-des'), fins = val('rm-h-fins'), anul = $('rm-h-anullades').checked;
    var files = [];
    for (var i = totes.length - 1; i >= 0; i--) {
      var r = totes[i];
      if (!anul && r.estat === 'ANULLADA') continue;
      if (des && r.data < des) continue;
      if (fins && r.data > fins) continue;
      if (q && normal([r.pacient.nom, r.medicament.principi, r.medicament.dosi].join(' ')).indexOf(q) < 0) continue;
      files.push(r);
    }
    $('rm-h-taula').hidden = !files.length;
    compte.textContent = files.length === 1 ? t('h_compte_1') : t('h_compte_n', { n: files.length });
    if (!files.length) { buit.textContent = totes.length ? t('h_cap') : t('h_buit'); buit.hidden = false; return; }
    buit.hidden = true;
    var html = files.map(function (r) {
      var pos = String(r.posologia || '').replace(/\s+/g, ' ');
      if (pos.length > 60) pos = pos.slice(0, 60) + '\u2026';
      var est = r.estat === 'ANULLADA' ? 'ANULLADA' : 'EMESA';
      var v = { id: r.id, pac: r.pacient.nom };
      return '<tr data-id="' + esc(r.id) + '"' + (est === 'ANULLADA' ? ' class="rm-anullada"' : '') + '>' +
        '<td data-l="' + esc(t('h_col_data')) + '">' + esc(ddmmaaaa(r.data)) + '</td>' +
        '<td data-l="' + esc(t('h_col_pacient')) + '">' + esc(r.pacient.nom) + '</td>' +
        '<td data-l="' + esc(t('h_col_med')) + '" class="rm-h-med">' + esc([r.medicament.principi, r.medicament.dosi].filter(Boolean).join(' ')) + '</td>' +
        '<td data-l="' + esc(t('h_col_pos')) + '">' + esc(pos) + '</td>' +
        '<td data-l="' + esc(t('h_col_estat')) + '"><span class="rm-estat ' + (est === 'ANULLADA' ? 'anullada' : 'emesa') + '">' + esc(t('estat_' + est)) + '</span>' +
          (r.prova ? '<span class="rm-mostra">' + esc(t('mostra')) + '</span>' : '') + '</td>' +
        '<td class="rm-accions">' +
          '<button type="button" class="rm-btn sec mini b-veure" aria-label="' + esc(t('aria_veure', v)) + '">' + esc(t('b_veure')) + '</button>' +
          '<button type="button" class="rm-btn sec mini b-repetir" aria-label="' + esc(t('aria_repetir', v)) + '">' + esc(t('b_repetir')) + '</button>' +
          (est === 'EMESA' ? '<button type="button" class="rm-btn perill mini b-anullar" aria-label="' + esc(t('aria_anullar', v)) + '">' + esc(t('b_anullar')) + '</button>' : '') +
        '</td></tr>';
    }).join('');
    cos.innerHTML = html;
  }
  var tornaFocus = null;
  function obreModal(id, focusId) {
    tornaFocus = document.activeElement;
    $(id).hidden = false;
    var f = $(focusId); if (f) f.focus();
  }
  function tancaModal(id) {
    $(id).hidden = true;
    if (id === 'rm-modal-veure') $('rm-mv-full').textContent = '';
    if (tornaFocus && document.body.contains(tornaFocus)) { try { tornaFocus.focus(); } catch (e) {} }
    tornaFocus = null;
  }
  /* .b-veure · nomes lectura, sense cap boto d'imprimir */
  function veure(id) {
    var r = trobaRecepta(id); if (!r) return;
    $('rm-mv-tit').textContent = t('mv_tit', { id: r.id });
    var info = [t('mv_info', { data: ddmmaaaa(r.data) })];
    if (r.origen) info.push(t('mv_origen', { id: r.origen }));
    if (r.estat === 'ANULLADA' && r.anullacio) info.push(t('mv_anullada', { data: ddmmaaaa(String(r.anullacio.el || '').slice(0, 10)), motiu: r.anullacio.motiu || '' }));
    $('rm-mv-info').textContent = info.join(' ');
    var cont = $('rm-mv-full'); cont.textContent = '';
    obreModal('rm-modal-veure', 'b-mv-tanca');
    var full = construeixFull(receptaPerPintar(r), { anullada: r.estat === 'ANULLADA' });
    cont.appendChild(full);
    ajusta(full);
    escalaA(cont, full);
  }
  /* .b-repetir · un esborrany NOU amb origen; no imprimeix res sol */
  function repeteix(id) {
    var r = trobaRecepta(id); if (!r) return;
    if (E.centre && r.metgeClau !== E.metge) return;
    if (E.emesa) desbloquejaFormulari();
    else if (!formulariBuit() && !window.confirm(t('repetir_confirma'))) return;
    posaFormulari({ pacient: clona(r.pacient), medicament: clona(r.medicament), posologia: r.posologia, origen: r.id });
    obrePestanya('nova');
    desaEsborrany();
    pintaPrevi();
    banner('info', t('repetida', { id: r.id }));
    $('b-imprimir-recepta').focus();
  }
  /* .b-anullar · motiu de 3 a 200 caracters i confirmacio; no s'esborra res */
  function obreAnullar(id) {
    var r = trobaRecepta(id); if (!r || r.estat !== 'EMESA') return;
    E.filaAnullar = id;
    $('rm-ma-resum').textContent = t('ma_resum', { id: r.id, pac: r.pacient.nom, med: [r.medicament.principi, r.medicament.dosi].filter(Boolean).join(' ') });
    $('rm-ma-motiu').value = ''; $('rm-ma-confirma').checked = false; $('rm-ma-err').hidden = true;
    obreModal('rm-modal-anullar', 'rm-ma-motiu');
  }
  function confirmaAnullar() {
    var motiu = String($('rm-ma-motiu').value || '').trim().replace(/\s+/g, ' ');
    var err = $('rm-ma-err');
    if (motiu.length < 3 || motiu.length > 200) { err.textContent = t('ma_err_motiu'); err.hidden = false; $('rm-ma-motiu').focus(); return; }
    if (!$('rm-ma-confirma').checked) { err.textContent = t('ma_err_conf'); err.hidden = false; $('rm-ma-confirma').focus(); return; }
    var l = llistaPerEscriure(K.rec), r = null;
    if (!l) { err.textContent = t('err_illegible'); err.hidden = false; return; }
    for (var i = 0; i < l.length; i++) if (l[i] && l[i].id === E.filaAnullar) r = l[i];
    if (!r || r.estat !== 'EMESA') { tancaModal('rm-modal-anullar'); return; }
    r.estat = 'ANULLADA';
    r.anullacio = { el: new Date().toISOString(), motiu: motiu };
    try { escriu(K.rec, l); } catch (e) { err.textContent = t('err_desar'); err.hidden = false; return; }
    var id = r.id;
    E.filaAnullar = null;
    tancaModal('rm-modal-anullar');
    pintaHistorial();
    banner('ok', t('anullada_ok', { id: id }));
  }

  /* ─────────── exportacio (§6.3): com descarrega() de FacturaMed ─────────── */
  function descarrega(nom, contingut, mime) {
    var blob = new Blob([contingut], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nom;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function cel(v) { v = String(v == null ? '' : v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  /* A2 §10 (P-ENG-74) · com FacturaMed: una exportacio no segueix la pantalla. Les
     capçaleres i els valors traduits del CSV, en castella sempre. */
  function tEs(k) { return TXT.es[k] != null ? TXT.es[k] : t(k); }
  function exportaCSV() {
    var l = llista(K.rec).filter(function (r) { return r && r.id && r.pacient && r.medicament; });
    if (!l.length) { banner('info', t('exporta_buit')); return; }
    var cap0 = ['csv_id', 'csv_data', 'csv_estat', 'csv_pacient', 'csv_naix', 'csv_document', 'csv_principi', 'csv_dosi', 'csv_forma', 'csv_via', 'csv_format', 'csv_envasos', 'csv_posologia', 'csv_metge', 'csv_colegiat', 'csv_mostra'].map(tEs);
    var files = l.map(function (r) {
      var pf = perfilDe(r.pid) || { metge: {} }, m = pf.metge || {}, d = r.pacient.doc || {};
      return [r.id, ddmmaaaa(r.data), tEs('estat_' + (r.estat === 'ANULLADA' ? 'ANULLADA' : 'EMESA')), r.pacient.nom, ddmmaaaa(r.pacient.naixement),
        d.num ? pr('es', 'doc_' + (DOCS.indexOf(d.tipus) >= 0 ? d.tipus : 'DNI')) + ' ' + d.num : '',
        r.medicament.principi, r.medicament.dosi, r.medicament.forma, r.medicament.via, r.medicament.format, r.medicament.envasos,
        r.posologia, [m.tractament, m.nom].filter(Boolean).join(' '), m.colegiat || '', r.prova ? tEs('si') : tEs('no')].map(cel).join(';');
    });
    var nom = 'ReceptaMed_receptes_' + avuiISO() + '.csv';
    descarrega(nom, '\uFEFF' + cap0.join(';') + '\n' + files.join('\n'), 'text/csv;charset=utf-8');
    banner('ok', t('exportat', { nom: nom }));
  }
  function exportaJSON() {
    var copia = { format: 'receptamed-copia', versio: 1, exportada: new Date().toISOString(), rm_config: llegeix(K.cfg, null), rm_perfils: llista(K.perfils), rm_receptes: llista(K.rec) };
    var nom = 'ReceptaMed_copia_' + avuiISO() + '.json';
    descarrega(nom, JSON.stringify(copia, null, 2), 'application/json');
    banner('ok', t('exportat', { nom: nom }));
  }

  /* ─────────── la barra de mode de prova (§9.1), la de cmstore.js ─────────── */
  function barra() { try { if (window.cmStore && cmStore.barraProva) cmStore.barraProva({ tornar: 'recepta' }); } catch (e) {} }

  /* ═══════════════════ ESDEVENIMENTS ═══════════════════ */
  function canviFormulari() {
    if (!appActiva || E.emesa) return;
    programaEsborrany();
    pintaPrevi();
  }
  function connecta() {
    /* pestanyes, amb fletxes */
    PESTANYES.forEach(function (p, i) {
      var tb = $('tab-' + p);
      tb.addEventListener('click', function () { obrePestanya(p); });
      tb.addEventListener('keydown', function (ev) {
        if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
          ev.preventDefault();
          obrePestanya(PESTANYES[(i + (ev.key === 'ArrowRight' ? 1 : PESTANYES.length - 1)) % PESTANYES.length], true);
        }
      });
    });
    $('rm-metge').addEventListener('change', function () { E.metge = this.value; this.removeAttribute('aria-invalid'); canviMetge(); });
    /* el pacient */
    var cerca = $('rm-pac-cerca');
    cerca.addEventListener('input', pintaLlistaPacients);
    cerca.addEventListener('keydown', function (ev) {
      var obert = !$('rm-pac-llista').hidden;
      if (ev.key === 'ArrowDown') { ev.preventDefault(); if (!obert) pintaLlistaPacients(); marcaOpcio(E.llistaSel + 1); }
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); marcaOpcio(E.llistaSel - 1); }
      else if (ev.key === 'Enter') { ev.preventDefault(); if (obert && E.llistaSel >= 0 && resultats[E.llistaSel]) triaPacient(resultats[E.llistaSel]); }
      else if (ev.key === 'Escape') { tancaLlista(); }
    });
    cerca.addEventListener('blur', function () { setTimeout(tancaLlista, 150); });
    $('b-pac-nou').addEventListener('click', function () { if ($('rm-pac-nou').hidden) obrePacientNou(); else tancaPacientNou(); });
    $('b-pn-crea').addEventListener('click', creaPacient);
    $('b-pn-cancel').addEventListener('click', function () { tancaPacientNou(); $('b-pac-nou').focus(); });
    $('rm-pac-doc-tipus').addEventListener('change', canviFormulari);
    $('rm-pac-doc-num').addEventListener('blur', function () { var v = normDoc(this.value); if (v !== this.value) { this.value = v; canviFormulari(); } });
    CAMPS_MED.concat(['rm-pac-naix', 'rm-pac-doc-num']).forEach(function (id) {
      $(id).addEventListener('input', function () { this.removeAttribute('aria-invalid'); if (id === 'rm-envasos') avisEnvasos(); canviFormulari(); });
      $(id).addEventListener('change', canviFormulari);
    });
    /* §6.2 · LA TECLA RETORN NO IMPRIMEIX MAI: ni des d'un camp ni des del
       boto amb el focus (l'espai si que l'activa). */
    $('sec-nova').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && ev.target && ev.target.tagName !== 'TEXTAREA' && ev.target.id !== 'rm-pac-cerca') {
        if (ev.target.tagName === 'INPUT' || ev.target.id === 'b-imprimir-recepta') ev.preventDefault();
      }
    });
    $('b-imprimir-recepta').addEventListener('click', imprimeix);
    $('b-netejar').addEventListener('click', netejar);
    $('b-una-altra').addEventListener('click', unaAltra);
    /* historial */
    ['rm-h-cerca', 'rm-h-des', 'rm-h-fins'].forEach(function (id) { $(id).addEventListener('input', pintaHistorial); $(id).addEventListener('change', pintaHistorial); });
    $('rm-h-anullades').addEventListener('change', pintaHistorial);
    $('rm-h-files').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      var tr = b.closest('tr'); if (!tr) return;
      var id = tr.getAttribute('data-id');
      if (b.classList.contains('b-veure')) veure(id);
      else if (b.classList.contains('b-repetir')) repeteix(id);
      else if (b.classList.contains('b-anullar')) obreAnullar(id);
    });
    $('b-exporta-csv').addEventListener('click', exportaCSV);
    $('b-exporta-json').addEventListener('click', exportaJSON);
    $('b-mv-tanca').addEventListener('click', function () { tancaModal('rm-modal-veure'); });
    $('b-ma-cancel').addEventListener('click', function () { tancaModal('rm-modal-anullar'); });
    $('b-ma-anulla').addEventListener('click', confirmaAnullar);
    ['rm-modal-veure', 'rm-modal-anullar'].forEach(function (id) {
      $(id).addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') { tancaModal(id); return; }
        if (ev.key !== 'Tab') return;
        /* el focus no surt de la finestra mentre és oberta (aria-modal) */
        var f = [].filter.call($(id).querySelectorAll('button, input, textarea, select, [tabindex]:not([tabindex="-1"])'), function (x) { return !x.disabled && x.offsetParent !== null; });
        if (!f.length) return;
        if (ev.shiftKey && document.activeElement === f[0]) { ev.preventDefault(); f[f.length - 1].focus(); }
        else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { ev.preventDefault(); f[0].focus(); }
      });
      $(id).addEventListener('mousedown', function (ev) { if (ev.target === $(id)) tancaModal(id); });
    });
    /* dades */
    $('b-desa-dades').addEventListener('click', desaDades);
    $('b-full-alineacio').addEventListener('click', imprimeixAlineacio);
    $('b-avis-model-entesos').addEventListener('click', entesosAvisModel);
    document.querySelectorAll('input[name="rm-paper"]').forEach(function (r) { r.addEventListener('change', function () { $('rm-d-avis-capcalera').hidden = paperTriat() !== 'CAPCALERA'; vigilaDades(); vigilaMarge(); }); });
    /* DIS-16 §1 i §2 · els limits i el marge, en viu, a «Dades de la recepta» */
    ['rm-d-tractament', 'rm-d-nom', 'rm-d-especialitat', 'rm-d-extra1', 'rm-d-extra2', 'rm-d-colegiat', 'rm-d-cnom', 'rm-d-linia1', 'rm-d-linia2', 'rm-d-telefon', 'rm-d-correu', 'rm-d-idioma'].forEach(function (id) {
      $(id).addEventListener('input', programaVigilaDades); $(id).addEventListener('change', programaVigilaDades);
    });
    ['rm-d-dx', 'rm-d-dy'].forEach(function (id) { $(id).addEventListener('input', vigilaMarge); $(id).addEventListener('change', vigilaMarge); });
    $('sec-dades').addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target && ev.target.tagName === 'INPUT') ev.preventDefault(); });
    /* la mida de la previsualitzacio */
    var ro = window.ResizeObserver ? new ResizeObserver(function () { escalaA($('rm-previsualitzacio'), $('rm-previsualitzacio').firstChild); escalaA($('rm-mv-full'), $('rm-mv-full').firstChild); }) : null;
    if (ro) { ro.observe($('rm-previsualitzacio')); ro.observe($('rm-mv-full')); }
    else window.addEventListener('resize', function () { escalaA($('rm-previsualitzacio'), $('rm-previsualitzacio').firstChild); });
    /* les fitxes arriben d'altres dispositius (cmsync) i les receptes, d'altres pestanyes */
    window.addEventListener('cm-sync-pull', function () { if (appActiva && !$('rm-pac-llista').hidden) pintaLlistaPacients(); });
    window.addEventListener('storage', function (ev) {
      if (!appActiva || !ev.key) return;
      if (ev.key === K.rec || ev.key === K.perfils) pintaHistorial();
      if (ev.key === K.cfg) { E.cfg = carregaCfg(); pintaDades(); pintaPrevi(); pintaAvisDades(); }
      if (ev.key === KF.conf) preparaCentre(false);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrenca);
  else arrenca();
})();
</script>
